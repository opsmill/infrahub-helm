# HTTPS front for the in-cluster Garage of the infrahub-backup e2e test.
#
# Garage serves its S3 API over plain HTTP only, so nginx terminates TLS in front
# of it with a certificate that a private CA, generated by the s3_k8s fixture in
# tests/e2e/conftest.py, issued for the "garage-tls" Service. The backup and
# restore Jobs reach the bucket through this Service only, so they upload and
# download over a TLS connection that no public trust store accepts.
#
# Loaded as plain YAML, not rendered with string.Template, so the nginx variables
# below need no escaping. The TLS material comes from the Secret "garage-tls".
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-tls-nginx
data:
  nginx.conf: |
    worker_processes 1;
    error_log /dev/stderr info;
    events {
      worker_connections 128;
    }
    http {
      access_log /dev/stdout combined;
      server {
        listen 8443 ssl;
        ssl_certificate     /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;

        # A backup archive is uploaded in parts far larger than nginx's 1 MB
        # default, so pass request bodies through unbuffered and unbounded.
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;

        location / {
          proxy_pass http://garage:3900;
          proxy_http_version 1.1;
          # S3 signs the Host header, so Garage must see the one the client signed.
          proxy_set_header Host $http_host;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: garage-tls
  labels:
    app: garage-tls
spec:
  replicas: 1
  selector:
    matchLabels:
      app: garage-tls
  template:
    metadata:
      labels:
        app: garage-tls
    spec:
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          ports:
            - containerPort: 8443
              name: https
          # Garage answers an anonymous request with 403, so readiness checks
          # the TLS port alone.
          readinessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 1
            periodSeconds: 3
            failureThreshold: 60
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tls
              mountPath: /etc/nginx/tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: garage-tls-nginx
        - name: tls
          secret:
            secretName: garage-tls
---
apiVersion: v1
kind: Service
metadata:
  name: garage-tls
  labels:
    app: garage-tls
spec:
  selector:
    app: garage-tls
  ports:
    # Port 443 so the S3 endpoint the Jobs are given needs no port suffix.
    - name: https
      port: 443
      targetPort: 8443
