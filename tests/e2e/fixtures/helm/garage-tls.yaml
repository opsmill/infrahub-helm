# HTTPS front for the in-cluster Garage of the infrahub-backup e2e test.
#
# Garage serves its S3 API over plain HTTP only, so HAProxy terminates TLS in
# front of it with a certificate that a private CA, generated by the s3_k8s
# fixture in tests/e2e/conftest.py, issued for the "garage-tls" Service. The
# backup and restore Jobs reach the bucket through this Service only, so they
# upload and download over a TLS connection that no public trust store accepts.
#
# Loaded as plain YAML, not rendered with string.Template. The TLS material comes
# from the Secret "garage-tls".
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-tls-haproxy
data:
  haproxy.cfg: |
    global
      log stdout format raw local0 info

    defaults
      mode http
      log global
      option httplog
      # The readiness probe opens connections without a request.
      option dontlognull
      timeout connect 5s
      timeout client 10m
      timeout server 10m

    frontend s3
      # HAProxy loads the key from the certificate path suffixed with ".key".
      bind :8443 ssl crt /usr/local/etc/haproxy/tls/garage-tls.pem
      default_backend garage

    backend garage
      server garage garage:3900
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: garage-tls
  labels:
    app: garage-tls
spec:
  replicas: 1
  selector:
    matchLabels:
      app: garage-tls
  template:
    metadata:
      labels:
        app: garage-tls
    spec:
      containers:
        - name: haproxy
          image: haproxy:3.2-alpine
          ports:
            - containerPort: 8443
              name: https
          # Garage answers an anonymous request with 403, so readiness checks
          # the TLS port alone.
          readinessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 1
            periodSeconds: 3
            failureThreshold: 60
          volumeMounts:
            - name: config
              mountPath: /usr/local/etc/haproxy/haproxy.cfg
              subPath: haproxy.cfg
              readOnly: true
            - name: tls
              mountPath: /usr/local/etc/haproxy/tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: garage-tls-haproxy
        - name: tls
          secret:
            secretName: garage-tls
            items:
              - key: tls.crt
                path: garage-tls.pem
              - key: tls.key
                path: garage-tls.pem.key
---
apiVersion: v1
kind: Service
metadata:
  name: garage-tls
  labels:
    app: garage-tls
spec:
  selector:
    app: garage-tls
  ports:
    # Port 443 so the S3 endpoint the Jobs are given needs no port suffix.
    - name: https
      port: 443
      targetPort: 8443
