# Minimal, fast Infrahub Enterprise values for e2e testing inside a vcluster.
# The enterprise chart wraps the community chart as a dependency named
# "infrahub", so all community overrides are nested under the `infrahub:` key.
infrahub:
  global:
    imagePullPolicy: IfNotPresent

  infrahub-backup:
    enabled: false
  infrahub-observability:
    enabled: false

  upgrade:
    enabled: false

  infrahubDemoData:
    enabled: false

  infrahubServer:
    replicas: 1
    infrahubServer:
      imagePullPolicy: IfNotPresent
      livenessProbe:
        httpGet:
          path: /api/config
          port: 8000
        failureThreshold: 120
        initialDelaySeconds: 5
        periodSeconds: 2
        timeoutSeconds: 2
      readinessProbe:
        httpGet:
          path: /api/config
          port: 8000
        failureThreshold: 120
        initialDelaySeconds: 5
        periodSeconds: 2
        timeoutSeconds: 2

  infrahubTaskWorker:
    replicas: 1
    infrahubTaskWorker:
      imagePullPolicy: IfNotPresent

  prefect-server:
    postgresql:
      primary:
        startupProbe:
          enabled: true
          initialDelaySeconds: 1
          periodSeconds: 2
          timeoutSeconds: 2
          failureThreshold: 120
        readinessProbe:
          initialDelaySeconds: 1
          periodSeconds: 2
          timeoutSeconds: 2
          failureThreshold: 120
        resourcesPreset: none

  rabbitmq:
    startupProbe:
      enabled: true
      initialDelaySeconds: 1
      periodSeconds: 2
      timeoutSeconds: 2
      failureThreshold: 120
    readinessProbe:
      initialDelaySeconds: 1
      periodSeconds: 2
      timeoutSeconds: 2
      failureThreshold: 120
    resourcesPreset: none

  redis:
    master:
      startupProbe:
        enabled: true
        initialDelaySeconds: 1
        periodSeconds: 2
        timeoutSeconds: 2
        failureThreshold: 120
      readinessProbe:
        initialDelaySeconds: 1
        periodSeconds: 2
        timeoutSeconds: 2
        failureThreshold: 120
      resourcesPreset: none
