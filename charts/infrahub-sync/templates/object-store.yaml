{{- include "infrahub-sync.validate" . }}
{{- if .Values.objectStore.enabled }}
{{- $name := include "infrahub-sync.componentName" (dict "context" . "component" "object-store") }}
{{- $secretName := include "infrahub-sync.secretName" . }}
{{- $store := .Values.objectStore }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "infrahub-sync.labels" (dict "context" . "component" "object-store") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: s3
      port: 9000
      targetPort: s3
      protocol: TCP
  selector:
    {{- include "infrahub-sync.selectorLabels" (dict "context" . "component" "object-store") | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "infrahub-sync.labels" (dict "context" . "component" "object-store") | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ $name }}
  selector:
    matchLabels:
      {{- include "infrahub-sync.selectorLabels" (dict "context" . "component" "object-store") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "infrahub-sync.selectorLabels" (dict "context" . "component" "object-store") | nindent 8 }}
        {{- with $store.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # The root credentials come from the Secret: restart when the chart's Secret changes.
        checksum/secret: {{ include "infrahub-sync.checksum.secret" . | quote }}
        {{- with $store.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "infrahub-sync.pod.common" (dict "context" . "values" $store) | nindent 6 }}
      # fsGroup gives the volume to 65532, which replaces the `object-store-init` ownership step
      # of docker-compose.yml.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: object-store
          image: {{ include "infrahub-sync.digestImage" $store.image | quote }}
          imagePullPolicy: IfNotPresent
          # The image's entrypoint runs `silo`; these are its arguments, as the Compose `command`.
          args:
            - server
            - /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: s3
              containerPort: 9000
              protocol: TCP
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: INFRAHUB_SYNC_S3_ACCESS_KEY
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: INFRAHUB_SYNC_S3_SECRET_KEY
            - name: MINIO_BROWSER
              value: "off"
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          {{- with $store.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "infrahub-sync.selectorLabels" (dict "context" . "component" "object-store") | nindent 10 }}
      spec:
        accessModes:
          - ReadWriteOnce
        {{- with $store.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $store.persistence.size | quote }}
{{- end }}
