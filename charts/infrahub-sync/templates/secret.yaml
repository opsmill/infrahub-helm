{{- include "infrahub-sync.validate" . }}
{{- if not .Values.credentials.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "infrahub-sync.secretName" . }}
  labels:
    {{- include "infrahub-sync.labels" (dict "context" .) | nindent 4 }}
type: Opaque
data:
  {{- include "infrahub-sync.secret.data" . | trim | nindent 2 }}
{{- end }}
