{{- include "infrahub-sync.validate" . }}
{{- if .Values.gatewayApi.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "infrahub-sync.httproute.name" . }}
  labels:
    {{- include "infrahub-sync.labels" (dict "context" .) | nindent 4 }}
    {{- with .Values.gatewayApi.httpRoute.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.gatewayApi.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
  {{- if .Values.gatewayApi.httpRoute.parentRefs }}
  {{- range .Values.gatewayApi.httpRoute.parentRefs }}
    - name: {{ .name }}
      {{- with .namespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with .sectionName }}
      sectionName: {{ . }}
      {{- end }}
      {{- with .port }}
      port: {{ . }}
      {{- end }}
  {{- end }}
  {{- else }}
    - name: {{ include "infrahub-sync.gateway.name" . }}
  {{- end }}
  {{- with .Values.gatewayApi.httpRoute.hostnames }}
  hostnames:
  {{- range . }}
    - {{ . | quote }}
  {{- end }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.gatewayApi.httpRoute.path | default "/" }}
      backendRefs:
        - name: {{ include "infrahub-sync.componentName" (dict "context" . "component" "api") }}
          port: {{ .Values.api.service.port }}
    {{- with .Values.gatewayApi.httpRoute.extraRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
