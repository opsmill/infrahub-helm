# yamllint disable rule:line-length
---
infrahub:
  global:
    kubernetesClusterDomain: cluster.local
    infrahubRepository: opsmill/infrahub-enterprise
    imagePullPolicy: IfNotPresent
  infrahubServer:
    podSecurityContext:
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
      fsGroup: 1000
    infrahubServer:
      securityContext:
        allowPrivilegeEscalation: false
      args:
        - gunicorn
        - --config
        - /source/community/backend/infrahub/serve/gunicorn_config.py
        - -w
        - "2"
        - --logger-class
        - infrahub.serve.log.GunicornLogger
        - infrahub_enterprise.server:app
      env:
        INFRAHUB_ALLOW_ANONYMOUS_ACCESS: "true"
        INFRAHUB_CACHE_PORT: 6379
        INFRAHUB_DB_TYPE: neo4j
        INFRAHUB_LOG_LEVEL: INFO
        INFRAHUB_PRODUCTION: "false"
        INFRAHUB_INITIAL_ADMIN_TOKEN: 06438eb2-8019-4776-878c-0941b1f1d1ec
        INFRAHUB_SECURITY_SECRET_KEY: 327f747f-efac-42be-9e73-999f08f86b92
        INFRAHUB_GIT_REPOSITORIES_DIRECTORY: "/opt/infrahub/git"
        INFRAHUB_WORKFLOW_ADDRESS: prefect-server
        INFRAHUB_WORKFLOW_PORT: 4200
        INFRAHUB_WORKFLOW_DEFAULT_WORKER_TYPE: "infrahubentasync"
        PREFECT_API_URL: "http://prefect-server:4200/api"
    replicas: 1
  infrahubTaskWorker:
    podSecurityContext:
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
      fsGroup: 1000
    infrahubTaskWorker:
      securityContext:
        allowPrivilegeEscalation: false
      args:
        - prefect
        - worker
        - start
        - --type
        - infrahubentasync
        - --pool
        - infrahub-worker
        - --with-healthcheck
      env:
        INFRAHUB_PAGINATION_SIZE: "50"
    replicas: 2
  infrahubDemoData:
    command:
      - sh
      - -c
      - "infrahubctl schema load community/models/base --wait 30 && infrahubctl run community/models/infrastructure_edge.py && infrahubctl menu load community/models/base_menu.yml && infrahubctl repository add demo-edge https://github.com/opsmill/infrahub-demo-edge --read-only"
  neo4j:
    neo4j:
      edition: "enterprise"
      acceptLicenseAgreement: "yes"
      resources:
        limits:
          cpu: "4"
          memory: "16Gi"
        requests:
          cpu: "4"
          memory: "16Gi"
    config:
      server.memory.heap.initial_size: "8G"
      server.memory.heap.max_size: "8G"
      server.memory.pagecache.size: "1G"
  prefect-server:
    global:
      prefect:
        image:
          repository: registry.opsmill.io/opsmill/infrahub-enterprise
    server:
      command:
        - /usr/bin/tini
        - -g
        - --
      args:
        - sh
        - -c
        - "env INFRAHUB_CACHE_ADDRESS=$PREFECT_REDIS_MESSAGING_HOST gunicorn -k uvicorn.workers.UvicornWorker -b 0.0.0.0:4200 'infrahub.prefect_server.app:create_infrahub_prefect()'"
      env:
        - name: PREFECT_UI_SERVE_BASE
          value: /
        - name: PREFECT__SERVER_WEBSERVER_ONLY
          value: "true"
        - name: PREFECT_SERVER_SERVICES_EVENT_LOGGER_ENABLED
          value: "false"
        - name: PREFECT_SERVER_SERVICES_EVENT_PERSISTER_ENABLED
          value: "false"
        - name: PREFECT_SERVER_SERVICES_TRIGGERS_ENABLED
          value: "false"
        - name: PREFECT_SERVER_SERVICES_TASK_RUN_RECORDER_ENABLED
          value: "false"
        - name: PREFECT_API_DATABASE_MIGRATE_ON_START
          value: "false"
        - name: PREFECT_API_BLOCKS_REGISTER_ON_START
          value: "false"
        - name: WEB_CONCURRENCY
          value: "1"
      podSecurityContext:
        runAsUser: 1000
        fsGroup: 1000
      containerSecurityContext:
        runAsUser: 1000
        readOnlyRootFilesystem: false
      replicaCount: 1
    migrations:
      enabled: false # Migrations are handled by custom Infrahub Prefect entrypoint
    backgroundServices:
      runAsSeparateDeployment: true
      command:
        - /usr/bin/tini
        - -g
        - --
      podLabels:
        infrahub/service: task-manager
      #replicaCount: 1
      messaging:
        redis:
          host: "example-infrahub-cache-master" # Set correct hostname
          db: 1
      args:
        - sh
        - -c
        - "while true; do if curl -s -o /dev/null http://prefect-server:4200; then break; fi; sleep 10; echo try; done; prefect server services start"
      env:
        - name: PREFECT_SERVER_SERVICES_EVENT_LOGGER_ENABLED
          value: "true"
        - name: PREFECT_SERVER_SERVICES_EVENT_PERSISTER_ENABLED
          value: "true"
        - name: PREFECT_SERVER_SERVICES_TRIGGERS_ENABLED
          value: "true"
        - name: PREFECT_SERVER_SERVICES_TASK_RUN_RECORDER_ENABLED
          value: "true"
        - name: PREFECT_API_DATABASE_MIGRATE_ON_START
          value: "false"
        - name: PREFECT_API_BLOCKS_REGISTER_ON_START
          value: "false"
    postgresql:
      primary:
        extraEnvVars:
          - name: POSTGRESQL_MAX_CONNECTIONS
            value: "100"
# yamllint disable rule:line-length
configPreset: small
