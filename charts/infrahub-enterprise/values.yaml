# yamllint disable rule:line-length
---
infrahub:
  global:
    kubernetesClusterDomain: cluster.local
    infrahubRepository: opsmill/infrahub-enterprise
    imagePullPolicy: IfNotPresent
  infrahubServer:
    podSecurityContext:
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
      fsGroup: 1000
    infrahubServer:
      securityContext:
        allowPrivilegeEscalation: false
      args:
        - gunicorn
        - --config
        - /source/community/backend/infrahub/serve/gunicorn_config.py
        - -w
        - "2"
        - --logger-class
        - infrahub.serve.log.GunicornLogger
        - infrahub_enterprise.server:app
      env:
        INFRAHUB_ALLOW_ANONYMOUS_ACCESS: "true"
        INFRAHUB_CACHE_PORT: 6379
        INFRAHUB_DB_TYPE: neo4j
        INFRAHUB_LOG_LEVEL: INFO
        INFRAHUB_PRODUCTION: "false"
        INFRAHUB_INITIAL_ADMIN_TOKEN: 06438eb2-8019-4776-878c-0941b1f1d1ec
        INFRAHUB_INITIAL_AGENT_TOKEN: 44af444d-3b26-410d-9546-b758657e026c
        INFRAHUB_SECURITY_SECRET_KEY: 327f747f-efac-42be-9e73-999f08f86b92
        INFRAHUB_GIT_REPOSITORIES_DIRECTORY: "/opt/infrahub/git"
        INFRAHUB_WORKFLOW_ADDRESS: prefect-server
        INFRAHUB_WORKFLOW_PORT: 4200
        INFRAHUB_WORKFLOW_DEFAULT_WORKER_TYPE: "infrahubentasync"
        PREFECT_API_URL: "http://prefect-server:4200/api"
  infrahubTaskWorker:
    podSecurityContext:
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
      fsGroup: 1000
    infrahubTaskWorker:
      securityContext:
        allowPrivilegeEscalation: false
      args:
        - prefect
        - worker
        - start
        - --type
        - infrahubentasync
        - --pool
        - infrahub-worker
        - --with-healthcheck
  infrahubDemoData:
    command:
      - sh
      - -c
      - "infrahubctl schema load community/models/base --wait 30 && infrahubctl run community/models/infrastructure_edge.py && infrahubctl menu load community/models/base_menu.yml && infrahubctl repository add demo-edge https://github.com/opsmill/infrahub-demo-edge --read-only"
  neo4j:
    neo4j:
      edition: "enterprise"
      acceptLicenseAgreement: "yes"
  prefect-server:
    global:
      prefect:
        image:
          repository: registry.opsmill.io/opsmill/infrahub-enterprise
        # -- How long the task manager keeps each kind of record: finished task runs with their logs and artifacts (`INFRAHUB_TASK_MANAGER_RETENTION_TASK_HISTORY`), the events of the activity log (`INFRAHUB_TASK_MANAGER_RETENTION_ACTIVITY_LOG`) and Prefect's own events (`INFRAHUB_TASK_MANAGER_RETENTION_PREFECT_OWN_EVENTS`). This list replaces the list of the infrahub chart, which sets `7d` for the events of the activity log. Each value is a number of days such as `30d` or an ISO 8601 duration such as `P30D`, from 1 to 365 days, and the value for Prefect's own events cannot be longer than the value for the events of the activity log; the task manager does not start with any other value. Infrahub reads these variables from 1.13 on. Helm replaces a list as a whole, so to change one value, set all three.
        env:
          - name: INFRAHUB_TASK_MANAGER_RETENTION_TASK_HISTORY
            value: "30d"
          - name: INFRAHUB_TASK_MANAGER_RETENTION_ACTIVITY_LOG
            value: "30d"
          - name: INFRAHUB_TASK_MANAGER_RETENTION_PREFECT_OWN_EVENTS
            value: "2d"
    server:
      command:
        - /usr/bin/tini
        - -g
        - --
      args:
        - sh
        - -c
        # Infrahub's startup lock uses the Redis that Prefect messaging uses. When messaging is set
        # through a URL, the chart sets no host, so the URL is passed on unless INFRAHUB_CACHE_URL is set.
        - >-
          if [ -n "$PREFECT_REDIS_MESSAGING_URL" ];
          then export INFRAHUB_CACHE_URL="${INFRAHUB_CACHE_URL:-$PREFECT_REDIS_MESSAGING_URL}";
          else export INFRAHUB_CACHE_ADDRESS="$PREFECT_REDIS_MESSAGING_HOST"; fi;
          exec gunicorn -k uvicorn.workers.UvicornWorker -b 0.0.0.0:4200 'infrahub.prefect_server.app:create_infrahub_prefect()'
      env:
      - name: PREFECT_UI_SERVE_BASE
        value: /
      podSecurityContext:
        runAsUser: 1000
        fsGroup: 1000
      containerSecurityContext:
        runAsUser: 1000
        readOnlyRootFilesystem: false
    migrations:
      enabled: false # Migrations are handled by custom Infrahub Prefect entrypoint
    backgroundServices:
      runAsSeparateDeployment: false
      command:
        - /usr/bin/tini
        - -g
        - --
      podLabels:
        infrahub/service: task-manager-background-svc