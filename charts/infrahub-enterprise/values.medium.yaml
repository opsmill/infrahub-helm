# yamllint disable rule:line-length
---
configPreset: medium
infrahub:
  infrahubServer:
    replicas: 2
  infrahubTaskWorker:
    replicas: 4
    infrahubTaskWorker:
      env:
        INFRAHUB_PAGINATION_SIZE: "500"
  neo4j:
    neo4j:
      resources:
        limits:
          cpu: "8"
          memory: "32Gi"
        requests:
          cpu: "8"
          memory: "32Gi"
    config:
      server.memory.heap.initial_size: "24G"
      server.memory.heap.max_size: "24G"
      server.memory.pagecache.size: "4G"
  prefect-server:
    postgresql:
      primary:
        extraEnvVars:
          - name: POSTGRESQL_MAX_CONNECTIONS
            value: "500"
    server:
      replicaCount: 2
      env:
        - name: INFRAHUB_CACHE_ADDRESS
          value: "example-infrahub-cache-master" # Set correct hostname
        - name: PREFECT_UI_SERVE_BASE
          value: /
        - name: PREFECT__SERVER_WEBSERVER_ONLY
          value: "true"
        - name: PREFECT_SERVER_SERVICES_EVENT_LOGGER_ENABLED
          value: "false"
        - name: PREFECT_SERVER_SERVICES_EVENT_PERSISTER_ENABLED
          value: "false"
        - name: PREFECT_SERVER_SERVICES_TRIGGERS_ENABLED
          value: "false"
        - name: PREFECT_SERVER_SERVICES_TASK_RUN_RECORDER_ENABLED
          value: "false"
        - name: PREFECT_API_DATABASE_MIGRATE_ON_START
          value: "false"
        - name: PREFECT_API_BLOCKS_REGISTER_ON_START
          value: "false"
        - name: WEB_CONCURRENCY
          value: "1"
    backgroundServices:
      replicaCount: 2
      runAsSeparateDeployment: true
      messaging:
        redis:
          host: "example-infrahub-cache-master" # Set correct hostname
          db: 1
      args:
        - sh
        - -c
        - "while true; do if curl -s -o /dev/null http://prefect-server:4200; then break; fi; sleep 10; echo try; done; prefect server services start"
      env:
        - name: INFRAHUB_CACHE_ADDRESS
          value: "example-infrahub-cache-master" # Set correct hostname
        - name: PREFECT_SERVER_SERVICES_EVENT_LOGGER_ENABLED
          value: "true"
        - name: PREFECT_SERVER_SERVICES_EVENT_PERSISTER_ENABLED
          value: "true"
        - name: PREFECT_SERVER_SERVICES_TRIGGERS_ENABLED
          value: "true"
        - name: PREFECT_SERVER_SERVICES_TASK_RUN_RECORDER_ENABLED
          value: "true"
        - name: PREFECT_API_DATABASE_MIGRATE_ON_START
          value: "false"
        - name: PREFECT_API_BLOCKS_REGISTER_ON_START
          value: "false"