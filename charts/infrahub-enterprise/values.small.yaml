# yamllint disable rule:line-length
---
configPreset: small
infrahub:
  infrahubServer:
    replicas: 1
  infrahubTaskWorker:
    replicas: 2
    infrahubTaskWorker:
      env:
        INFRAHUB_PAGINATION_SIZE: "50"
  neo4j:
    neo4j:
      resources:
        requests:
          cpu: "4"
          memory: "16Gi"
    config:
      server.memory.heap.initial_size: "8G"
      server.memory.heap.max_size: "8G"
      server.memory.pagecache.size: "1G"
  redis:
    master:
      resourcesPreset: "small"
  prefect-server:
    postgresql:
      primary:
        extraEnvVars:
          - name: POSTGRESQL_MAX_CONNECTIONS
            value: "100"
    server:
      replicaCount: 1
      env:
        - name: PREFECT_UI_SERVE_BASE
          value: /
        - name: PREFECT__SERVER_WEBSERVER_ONLY
          value: "true"
        - name: PREFECT_API_DATABASE_MIGRATE_ON_START
          value: "false"
        - name: PREFECT_API_BLOCKS_REGISTER_ON_START
          value: "false"
        - name: WEB_CONCURRENCY
          value: "1"
        - name: PREFECT_REDIS_MESSAGING_PUBLISHER_BATCH_SIZE
          value: "5"
    backgroundServices:
      replicaCount: 1
      runAsSeparateDeployment: true
      messaging:
        redis:
          host: "example-infrahub-cache-master" # Set correct hostname
          db: 1
        docket:
          url: "redis://example-infrahub-cache-master:6379/2" # Set correct hostname
      args:
        - sh
        - -c
        - "while true; do if curl -s -o /dev/null http://prefect-server:4200; then break; fi; sleep 10; echo try; done; prefect server services start"
      env:
        - name: PREFECT_API_BLOCKS_REGISTER_ON_START
          value: "false"
        - name: PREFECT_REDIS_MESSAGING_PUBLISHER_BATCH_SIZE
          value: "5"
        - name: PREFECT_SERVER_SERVICES_EVENT_PERSISTER_READ_BATCH_SIZE
          value: "1"
        - name: PREFECT_SERVER_SERVICES_EVENT_PERSISTER_BATCH_SIZE
          value: "20"
        - name: PREFECT_SERVER_SERVICES_TASK_RUN_RECORDER_READ_BATCH_SIZE
          value: "1"
        - name: PREFECT_SERVER_SERVICES_TASK_RUN_RECORDER_BATCH_SIZE
          value: "1"
        - name: PREFECT_SERVER_SERVICES_TRIGGERS_READ_BATCH_SIZE
          value: "1"