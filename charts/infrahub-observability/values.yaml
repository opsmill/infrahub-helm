---
# -- Default values for infrahub-observability.
# This is a YAML-formatted file.

# -- Global values shared across all sub-charts and templates in this chart.
global:
  # -- Cluster DNS domain. Used for fully-qualified service names if needed.
  kubernetesClusterDomain: cluster.local
  # -- Default imagePullPolicy for in-chart workloads (currently only the Prefect exporter).
  imagePullPolicy: IfNotPresent
  # -- Image pull secrets propagated to in-chart workloads.
  imagePullSecrets: []
  # -- Labels added to every resource managed by this chart.
  commonLabels: {}
  # -- Annotations added to every resource managed by this chart.
  commonAnnotations: {}
  # -- Pod-level labels merged into the standard selector labels.
  podLabels: {}
  # -- Release name of the sibling infrahub chart. Used by the Prefect exporter
  # to derive the default PREFECT_API_URL and by Alloy when scoping discovery.
  infrahubReleaseName: infrahub
  # -- Namespace where the sibling infrahub release lives. Empty string means
  # the same namespace as this release.
  infrahubNamespace: ""

# ----------------------------------------------------------------------------
# Alloy — unified collector (logs + metrics)
#
# We disable the upstream chart's auto-generated config and supply our own
# ConfigMap in templates/alloy-config.yaml. The DaemonSet controller is required
# so each node's Alloy can read pod logs from the local kubelet.
# ----------------------------------------------------------------------------
alloy:
  enabled: true
  controller:
    type: daemonset
  alloy:
    configMap:
      create: false
      # -- Name of the ConfigMap that holds Alloy's config.alloy file.
      # Resolved at render time via the helper.
      name: ""
      key: config.alloy
    mounts:
      varlog: true
      dockercontainers: false
    clustering:
      enabled: false
  # -- Scrape kubelet cAdvisor for per-container CPU/memory/network/fs
  # metrics. Requires the Alloy ServiceAccount to have `get nodes/proxy`,
  # which the subchart's default RBAC already grants. Disable if your
  # cluster's policy forbids that permission; the Container Resources
  # and Neo4j Monitoring dashboards will then show no data.
  cadvisor:
    enabled: true

# ----------------------------------------------------------------------------
# Loki — log storage (single-binary mode for parity with docker-compose)
# ----------------------------------------------------------------------------
loki:
  enabled: true
  deploymentMode: SingleBinary
  loki:
    auth_enabled: false
    server:
      log_level: warn
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    limits_config:
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      allow_structured_metadata: true
      max_global_streams_per_user: 15000
      ingestion_rate_mb: 32
      ingestion_burst_size_mb: 64
      max_entries_limit_per_query: 10000
      cardinality_limit: 100000
      per_stream_rate_limit: 3MB
      per_stream_rate_limit_burst: 5MB
      max_streams_per_user: 20000
      max_query_lookback: 24h
      retention_period: 24h
    compactor:
      working_directory: /var/loki/compactor
      compaction_interval: 10m
      retention_enabled: true
      retention_delete_delay: 2h
      retention_delete_worker_count: 100
      delete_request_store: filesystem
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 10Gi
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  test:
    enabled: false
  lokiCanary:
    enabled: false
  gateway:
    enabled: false

# ----------------------------------------------------------------------------
# Tempo — distributed tracing (single-binary, OTLP receivers, metrics generator)
# ----------------------------------------------------------------------------
tempo:
  enabled: true
  tempo:
    receivers:
      otlp:
        protocols:
          http: {}
          grpc:
            endpoint: 0.0.0.0:4317
    # metricsGenerator can extract RED metrics from spans and remote-write them
    # into Prometheus. Disabled by default because enabling it requires a
    # remoteWriteUrl that we cannot template from values.yaml. To enable, set:
    #   tempo.tempo.metricsGenerator.enabled: true
    #   tempo.tempo.metricsGenerator.remoteWriteUrl: "http://<obs-release>-prometheus-server/api/v1/write"
    metricsGenerator:
      enabled: false
    retention: 96h
  persistence:
    enabled: true
    size: 10Gi

# ----------------------------------------------------------------------------
# Prometheus — TSDB with remote-write receiver (Alloy is the source of truth
# for scrapes; Prometheus does no scraping itself).
# ----------------------------------------------------------------------------
prometheus:
  enabled: true
  alertmanager:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  prometheus-node-exporter:
    enabled: false  # we use the standalone subchart at the top level
  kube-state-metrics:
    enabled: false
  server:
    # web.enable-lifecycle and storage.tsdb.retention.time are set by the
    # subchart defaults; passing them via extraArgs would cause duplicate-flag
    # errors. Use `server.retention` for retention and `extraArgs` only for
    # flags the subchart doesn't already provide.
    retention: 96h
    extraArgs:
      web.enable-remote-write-receiver: ""
      log.level: warn
    persistentVolume:
      enabled: true
      size: 20Gi
  serverFiles:
    prometheus.yml:
      scrape_configs: []  # Alloy pushes via remote_write; no Prometheus-side scrape

# ----------------------------------------------------------------------------
# Node exporter — host-level metrics
# ----------------------------------------------------------------------------
prometheus-node-exporter:
  enabled: true

# ----------------------------------------------------------------------------
# Grafana — visualization. Datasources and dashboards are provisioned via
# sidecar-watched ConfigMaps that this chart creates (see templates/).
# ----------------------------------------------------------------------------
grafana:
  enabled: true
  adminUser: admin
  # -- Default password matches docker-compose dev parity. Override via
  # `grafana.admin.existingSecret` in production.
  adminPassword: admin
  service:
    type: ClusterIP
  ingress:
    enabled: false
  persistence:
    enabled: true
    size: 5Gi
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
    datasources:
      enabled: true
      label: grafana_datasource
      labelValue: "1"
      searchNamespace: ALL
  env:
    GF_USERS_ALLOW_SIGN_UP: "false"
    GF_LOG_LEVEL: warn

# ----------------------------------------------------------------------------
# Prefect prometheus exporter — no upstream chart available, shipped as a
# small Deployment+Service in this chart.
# ----------------------------------------------------------------------------
prefectExporter:
  # -- Enable the Prefect prometheus exporter sidecar Deployment.
  enabled: true
  image:
    repository: prefecthq/prometheus-prefect-exporter
    tag: "3.3.0"
    pullPolicy: ""  # falls back to global.imagePullPolicy
  # -- PREFECT_API_URL. Empty string defaults to the task-manager service of
  # the sibling infrahub release (see _helpers.tpl).
  prefectApiUrl: ""
  # -- Log level passed to the exporter.
  logLevel: WARNING
  replicas: 1
  service:
    type: ClusterIP
    port: 8000
  podAnnotations: {}
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # -- Pod-level security context for the Prefect exporter pod.
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
  # -- Container-level security context for the prefect-exporter container.
  # Empty by default so it stays optional; set this to satisfy cluster policies
  # that require a container-level securityContext (e.g. allowPrivilegeEscalation,
  # readOnlyRootFilesystem, capabilities).
  containerSecurityContext: {}
  # -- Readiness probe for the prefect-exporter container. The exporter builds
  # /metrics by querying the Prefect API on every request, so the response
  # time grows with the number of flows and deployments. timeoutSeconds is set
  # well above the Kubernetes default of 1s so the pod becomes Ready on larger
  # instances. Set to {} to remove the probe.
  readinessProbe:
    httpGet:
      path: /metrics
      port: metrics
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
  # -- Extra environment variables for the prefect-exporter container, for
  # example the exporter's OFFSET_MINUTES or FAILED_RUNS_OFFSET_MINUTES.
  extraEnv: []

# ----------------------------------------------------------------------------
# Grafana MCP server — lets an AI assistant, such as Claude Code, read the
# metrics, logs and traces of the stack through Grafana. It is off by default.
# It only reads: it runs with --disable-write --disable-api, and its Grafana
# service account has the Viewer role. A hook Job creates that service account
# and stores its token in a Secret, which the Deployment mounts as a file.
# ----------------------------------------------------------------------------
grafanaMcp:
  # -- Install the Grafana MCP server. This one flag turns on both the `grafana-mcp` dependency
  # and the hook Job of this chart. When false, the chart creates no object for the server.
  enabled: false
  grafana:
    # -- Name of the Secret with the Grafana admin user and password, which the hook
    # Job uses to create the service account. Empty: the admin Secret of the grafana
    # sub-chart (or `grafana.admin.existingSecret` when that is set).
    adminSecret: ""
  serviceAccountJob:
    # -- Image of the hook Job. It needs curl, sed, grep and base64: the Grafana image has them.
    image:
      repository: grafana/grafana
      tag: "11.1.5"
      pullPolicy: ""
    # -- Pod-level security context of the Job pod.
    securityContext:
      runAsNonRoot: true
      runAsUser: 472
      runAsGroup: 472
      fsGroup: 472
    # -- Container-level security context of the Job.
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
    # -- Resources of the Job.
    resources: {}

# Values of the grafana-mcp dependency (https://github.com/grafana-community/helm-charts, chart
# version 0.37.0). The dependency is installed only when `grafanaMcp.enabled` is true. Its values
# schema rejects an unknown key, so this chart keeps its own settings under `grafanaMcp`.
# The settings below make the server read-only, and the chart refuses to render when one is removed.
grafana-mcp:
  image:
    # -- Image of the Grafana MCP server.
    repository: grafana/mcp-grafana
    # -- Tag and digest of the image. The dependency builds the image as repository:tag, so the
    # digest is part of the tag. The image is under security review at this version.
    tag: "2.0.2@sha256:78d208116ec52b09b44f0eca66892073b39aefcb64483c54d43255c8eab7e97a"
  grafana:
    # -- Address of Grafana. The default is the Service of a release named `obs`. With another
    # release name, set it to `http://<release>-grafana`: the chart refuses to render otherwise.
    # When `grafana.enabled` is false, set the address of your Grafana.
    url: "http://obs-grafana"
  # -- Token that AI assistants send to the server, as a bearer token. Set `token` or
  # `tokenSecret.name`, or the chart refuses to render: without it, the dependency would
  # generate a token or turn authentication off.
  serverAuth:
    # -- The token as a plain value. The dependency stores it in a Secret. Prefer `tokenSecret`.
    token: ""
    tokenSecret:
      # -- Name of an existing Secret that holds the token. Takes the place of `token`.
      name: ""
      # -- Key of the token in that Secret.
      key: token
  # -- Pass --disable-write: the server has no tool that creates or changes anything in Grafana.
  # The chart refuses to render when this is false.
  disableWrite: true
  # -- Tool categories to turn off, passed as --disable-<category>. The chart refuses to render
  # without api, docs and plugin, unless `extraArgs` has the matching flag.
  disabledCategories: [api, docs, plugin]
  # -- Environment variables of the server.
  env:
    # -- Do not send usage data.
    DO_NOT_TRACK: "1"
    # -- File with the Grafana token. The hook Job writes the token to a Secret that the
    # `grafana-token` volume mounts here. The server reads the file on every call.
    GRAFANA_SERVICE_ACCOUNT_TOKEN_FILE: /var/run/grafana-mcp/token
  # -- Host header values that the server accepts, besides the loopback addresses and the
  # names of the Service. A client that uses another address, such as
  # `kubectl port-forward svc/<name> 8100:8000`, needs its host and port here.
  allowedHosts:
    extra:
      - localhost:8100
      - 127.0.0.1:8100
  # -- Arguments of the server. The dependency adds the flags of disableWrite, disabledCategories
  # and allowedHosts itself. To serve HTTPS, add `--server.tls-cert-file=/etc/grafana-mcp/tls/tls.crt`
  # and `--server.tls-key-file=/etc/grafana-mcp/tls/tls.key`, and mount the Secret with `volumes`
  # and `volumeMounts` (see the README). Do not change the port of `--address` without `service.port`.
  extraArgs:
    - --transport
    - streamable-http
    - --address
    - 0.0.0.0:8000
    - --healthz-address
    - ":8081"
    - --usage-stats=disabled
    - --instructions-append
    - "In this stack the Grafana MCP server only reads: it has no tool that creates or changes dashboards, folders, annotations, incidents, alert rules or data sources."
  # -- Probes on /healthz of the side listener (--healthz-address). It serves plain HTTP also when
  # the main port serves HTTPS, and it is outside the Host check that rejects a probe, which sends
  # the pod IP as its Host header. The default liveness probe of the dependency calls the main port.
  startupProbe:
    httpGet:
      path: /healthz
      port: 8081
    periodSeconds: 2
    failureThreshold: 30
  readinessProbe:
    # null removes the TCP check of the dependency: a probe has one handler.
    tcpSocket: null
    httpGet:
      path: /healthz
      port: 8081
    periodSeconds: 10
  livenessProbe:
    # null removes the Host header and timeout of the dependency, which belong to its probe on the main port.
    timeoutSeconds: null
    httpGet:
      httpHeaders: null
      path: /healthz
      port: 8081
    periodSeconds: 20
  # -- Pod-level security context. The image runs as user 1000, group 999. fsGroup lets that
  # group read a mounted TLS key.
  securityContext:
    fsGroup: 999
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  # -- Container-level security context.
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  # -- Volumes of the pod. The volume named `grafana-token` must stay: the hook Job writes the
  # Grafana token to the Secret it names, and the chart refuses to render without it. The Secret is
  # optional so the pod starts before the Job has written it, and `helm install --wait` can reach the
  # hook. The kubelet adds the token file 30 to 90 seconds after the Job.
  volumes:
    - name: grafana-token
      secret:
        secretName: grafana-mcp-grafana-token
        optional: true
        defaultMode: 0440
  # -- Volume mounts of the server.
  volumeMounts:
    - name: grafana-token
      mountPath: /var/run/grafana-mcp
      readOnly: true
