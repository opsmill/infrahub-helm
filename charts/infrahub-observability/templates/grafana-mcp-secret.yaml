{{- /* The token that AI assistants send. Created only when it is given as a value. */ -}}
{{- if and .Values.grafanaMcp.enabled (not .Values.grafanaMcp.serverToken.existingSecret) .Values.grafanaMcp.serverToken.value }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "infrahub-observability.grafanaMcpFullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    service: grafana-mcp
    {{- include "infrahub-observability.labels" . | nindent 4 }}
  {{- with (include "infrahub-observability.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{ .Values.grafanaMcp.serverToken.existingSecretKey }}: {{ .Values.grafanaMcp.serverToken.value | quote }}
{{- end }}
