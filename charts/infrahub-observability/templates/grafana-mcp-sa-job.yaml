{{- if .Values.grafanaMcp.enabled }}
{{- include "infrahub-observability.grafanaMcpValidate" . }}
{{- $name := include "infrahub-observability.grafanaMcpFullname" . }}
{{- $initName := printf "%s-init" $name }}
{{- $tokenSecret := include "infrahub-observability.grafanaMcpGrafanaTokenSecret" . }}
{{- $job := .Values.grafanaMcp.serviceAccountJob }}
{{- $admin := .Values.grafana.admin | default dict }}
{{- $adminSecret := .Values.grafanaMcp.grafana.adminSecret | default $admin.existingSecret | default (include "infrahub-observability.grafanaFullname" .) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $initName }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    service: grafana-mcp-init
    {{- include "infrahub-observability.labels" . | nindent 4 }}
  {{- with (include "infrahub-observability.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
---
# The Job creates the token Secret, so the Role allows `create`. Kubernetes cannot limit
# `create` to a name, so it limits `get` and `update` to the one Secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $initName }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    service: grafana-mcp-init
    {{- include "infrahub-observability.labels" . | nindent 4 }}
  {{- with (include "infrahub-observability.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $tokenSecret | quote }}]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $initName }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    service: grafana-mcp-init
    {{- include "infrahub-observability.labels" . | nindent 4 }}
  {{- with (include "infrahub-observability.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $initName }}
subjects:
  - kind: ServiceAccount
    name: {{ $initName }}
    namespace: {{ .Release.Namespace | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $initName }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    service: grafana-mcp-init
    {{- include "infrahub-observability.labels" . | nindent 4 }}
  {{- with (include "infrahub-observability.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
data:
  create-service-account.sh: |
    {{- .Files.Get "files/grafana-mcp/create-service-account.sh" | nindent 4 }}
  run.sh: |
    {{- .Files.Get "files/grafana-mcp/run.sh" | nindent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $initName }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    service: grafana-mcp-init
    {{- include "infrahub-observability.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    {{- with (include "infrahub-observability.annotations" .) }}
    {{- . | nindent 4 }}
    {{- end }}
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        service: grafana-mcp-init
        {{- include "infrahub-observability.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $initName }}
      automountServiceAccountToken: true
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $job.securityContext | nindent 8 }}
      containers:
        - name: create-service-account
          image: "{{ $job.image.repository }}:{{ $job.image.tag }}"
          imagePullPolicy: {{ default .Values.global.imagePullPolicy $job.image.pullPolicy }}
          {{- with $job.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: ["sh", "/scripts/run.sh"]
          env:
            - name: GRAFANA_URL
              value: {{ (index .Values "grafana-mcp").grafana.url | quote }}
            - name: GRAFANA_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $adminSecret | quote }}
                  key: {{ default "admin-user" $admin.userKey | quote }}
            - name: GRAFANA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $adminSecret | quote }}
                  key: {{ default "admin-password" $admin.passwordKey | quote }}
            - name: GRAFANA_MCP_ROLE
              value: Viewer
            - name: GRAFANA_MCP_TOKEN_FILE
              value: /work/token
            - name: GRAFANA_MCP_TOKEN_SECRET
              value: {{ $tokenSecret | quote }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: work
              mountPath: /work
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml $job.resources | nindent 12 }}
      volumes:
        - name: scripts
          configMap:
            name: {{ $initName }}
            defaultMode: 0555
        - name: work
          emptyDir: {}
        - name: tmp
          emptyDir: {}
{{- end }}
