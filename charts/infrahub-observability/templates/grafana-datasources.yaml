{{- /*
Datasource definitions are synced from upstream infrahub and adapted for K8s by
scripts/sync-upstream.sh (Docker hostnames rewritten to the chart's Service-URL
helpers). They are NOT committed — `helm template`/`helm lint` without a prior
sync renders an empty data key. The synced file carries `{{ include ... }}`
helper expressions, so it is rendered through `tpl`.
*/ -}}
{{- if .Values.grafana.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "infrahub-observability.fullname" . }}-grafana-datasources
  namespace: {{ .Release.Namespace | quote }}
  labels:
    grafana_datasource: "1"
    service: grafana
    {{- include "infrahub-observability.labels" . | nindent 4 }}
  {{- with (include "infrahub-observability.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
data:
  datasources.yaml: |
    {{- regexReplaceAll "(?m) +$" (tpl (.Files.Get "files/datasources.yaml") . | trimPrefix "---\n" | nindent 4) "" }}
{{- end }}
