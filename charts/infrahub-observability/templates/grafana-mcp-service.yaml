{{- if .Values.grafanaMcp.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "infrahub-observability.grafanaMcpFullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    service: grafana-mcp
    {{- include "infrahub-observability.labels" . | nindent 4 }}
  {{- with (include "infrahub-observability.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.grafanaMcp.service.type }}
  selector:
    service: grafana-mcp
    {{- include "infrahub-observability.selectorLabels" . | nindent 4 }}
  ports:
    - name: mcp
      port: {{ .Values.grafanaMcp.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
