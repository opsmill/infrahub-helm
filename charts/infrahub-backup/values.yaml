# Default values for infrahub-backup

# -- ServiceAccount configuration
serviceAccount:
  # -- Create a ServiceAccount for the backup/restore pods
  create: true
  # -- Name of the ServiceAccount (auto-generated if empty)
  name: ""
  # -- Annotations to add to the ServiceAccount
  annotations: {}

# -- RBAC configuration
rbac:
  # -- Create Role and RoleBinding for pod exec permissions
  create: true

# -- Backup configuration
backup:
  # -- Enable backup functionality
  enabled: false
  # -- Backup mode: "job" for one-shot, "cronjob" for scheduled
  mode: "job"
  # -- Schedule for CronJob mode (cron expression)
  schedule: "0 2 * * *"

  # -- Storage configuration
  storage:
    # -- Storage type: "s3" or "local"
    type: "s3"

    # -- Path within the pod to store backups
    path: "/infrahub_backups"

    # -- S3 storage settings
    s3:
      # -- S3 bucket name
      bucket: ""
      # -- S3 key prefix for backup artifacts
      prefix: ""
      # -- S3 endpoint URL (for S3-compatible storage other than AWS S3)
      endpoint: ""
      # -- S3 region
      region: "us-east-1"
      # -- Name of Kubernetes Secret containing AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY
      secretName: ""

    # -- Local storage settings
    local: {}

  # -- Backup options
  options:
    # -- Force backup even if another backup is in progress
    force: false
    # -- Exclude task-manager database from backup
    excludeTaskmanager: false
    # -- Neo4j metadata to include: "all", "none", or specific types
    neo4jMetadata: "all"
    # -- Keep local file after S3 upload (only applies when storage.type is "s3")
    keepLocal: false
    # -- Sleep duration after backup when using local storage (allows time to copy files)
    sleep: "3m" # default should be lower than Helm's default install timeout of 5m
    # -- Extra arguments to pass to the backup command
    extraArgs: []

# -- Restore configuration
restore:
  # -- Enable restore functionality (mutually exclusive with backup)
  enabled: false
  # -- Restore mode: "job" for one-shot, "cronjob" for scheduled (e.g. a nightly prod -> staging sync)
  mode: "job"
  # -- Schedule for CronJob mode (cron expression)
  schedule: "0 4 * * *"

  # -- Storage configuration
  storage:
    # -- Storage type: "s3" or "local" ("cronjob" mode requires "s3")
    type: "s3"

    # -- Path within the pod to store backups
    path: "/infrahub_backups"

    # -- S3 artifact location
    s3:
      # -- S3 bucket containing the backup
      bucket: ""
      # -- S3 key prefix the backups live under (with latest, match the source's backup.storage.s3.prefix). A restore
      # of an external Neo4j database also copies the artifact under `<prefix>/seed/`
      prefix: ""
      # -- S3 key (path) to the backup artifact (exactly one of key or latest must be set)
      key: ""
      # -- Restore the newest backup under bucket/prefix instead of naming one (exactly one of key or latest must be set)
      latest: false
      # -- S3 endpoint URL (for non-AWS S3-compatible storage)
      endpoint: ""
      # -- S3 region
      region: "us-east-1"
      # -- Name of Kubernetes Secret containing AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY
      secretName: ""

    # -- Local storage settings
    local:
      # -- File name of the backup to restore
      filename: "infrahub_backup_latest.tar.gz"

  # -- Restore options
  options:
    # -- Exclude task-manager database from restore
    excludeTaskmanager: false
    # -- Migrate backup format from older versions
    migrateFormat: false
    # -- With a Neo4j cluster, how long the restore waits for the database to come online on every server, such as
    # "15m". Passes `--neo4j-cluster-online-timeout`, which needs infrahub-backup 2.4.1 or later. Empty uses the
    # infrahub-backup default.
    neo4jClusterOnlineTimeout: ""
    # -- Sleep duration before restore when using local storage (allows time to copy files)
    sleep: "3m" # default should be lower than Helm's default install timeout of 5m
    # -- Extra arguments to pass to the restore command
    extraArgs: []

# -- Settings for a Neo4j or PostgreSQL database that runs outside the Infrahub namespace. They have no effect on a
# database that runs in the namespace. The backup and restore pods run in the Infrahub namespace, so infrahub-backup
# runs `neo4j-admin`, `cypher-shell` and the PostgreSQL client in its own container, and creates no Job and no Secret.
# Needs an infrahub-backup image with external database support.
externalDatabase:
  # -- Allow a restore to overwrite an external database. Sets `INFRAHUB_ALLOW_EXTERNAL_RESTORE` on the restore
  # containers only. A restore of an external Neo4j database also needs `restore.storage.type: s3`: infrahub-backup
  # copies the artifact under `seed/` in `restore.storage.s3.bucket`, and the Neo4j servers download it from there.
  allowRestore: false
  # -- Connect to an external database without verifying its certificate, and accept a connection with no
  # encryption when the deployment has TLS disabled. Sets `INFRAHUB_EXTERNAL_DB_INSECURE_TLS`. An external Neo4j
  # server with TLS disabled needs it.
  insecureTLS: false
  # -- Time limit for each operation against an external database, with a unit such as "4h" or "90m". Sets
  # `INFRAHUB_EXTERNAL_DB_TIMEOUT`. Empty uses the infrahub-backup default, 2h.
  timeout: ""
  # -- Free disk space that a capture of an external database needs, such as "20Gi". Sets
  # `INFRAHUB_EXTERNAL_DB_SCRATCH_SIZE`. Empty derives it from the database size, which Neo4j 2025 does not report.
  # infrahub-backup writes the capture under `TMPDIR` (`/tmp` when unset): to use a larger volume, add it with
  # `scratchVolume`.
  scratchSize: ""
  # -- Volume for the temporary files of a backup or restore of an external database, as a Kubernetes volume source
  # such as `{ephemeral: {volumeClaimTemplate: {spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage:
  # 50Gi}}}}}}`. The chart mounts it at `/scratch` and sets `TMPDIR` to that path. Empty keeps the temporary files in
  # the container filesystem, on the node's disk. infrahub-backup checks the free space of this volume against
  # `scratchSize` before a capture: a volume with a real size, such as the ephemeral PersistentVolumeClaim above, makes
  # this check meaningful, while the `sizeLimit` of an `emptyDir` is not visible to it. A PersistentVolumeClaim
  # usually also needs `podSecurityContext.fsGroup`, so that the user of the container can write to it.
  scratchVolume: {}
  # -- Neo4j hosts to back up from, as "host[:port][,host[:port]...]". Sets `INFRAHUB_NEO4J_ADDRESS`. Empty uses the
  # address the Infrahub server is configured with. For a Neo4j cluster, list every member, so that the backup can
  # use another member when one is down.
  neo4jAddress: ""
  # -- Port of the Neo4j backup service on every host, not the Bolt port. Sets `INFRAHUB_NEO4J_BACKUP_PORT`. Empty
  # uses the infrahub-backup default, 6362.
  neo4jBackupPort: ""
  # -- PostgreSQL endpoint of the task manager database, as "host[:port]". Sets `INFRAHUB_POSTGRES_ADDRESS`. Empty
  # uses the address the task manager is configured with.
  postgresAddress: ""

# -- Container image configuration
image:
  repository: registry.opsmill.io/opsmill/infrahub-backup
  # -- Tag defaults to chart appVersion if not specified
  tag: ""
  pullPolicy: IfNotPresent

# -- Image pull secrets for private registries
imagePullSecrets: []

# -- Resource limits and requests
resources:
  requests:
    cpu: "100m"
    memory: "256Mi"

# -- Extra environment variables for the backup and restore containers, appended after the ones the chart sets.
# For example, trust a private CA for an S3 endpoint with a self-signed or internal certificate:
# `[{name: SSL_CERT_FILE, value: /etc/ssl/custom/ca.crt}]` together with the volume below.
extraEnv: []

# -- Extra volumes for the backup and restore pods, for example a ConfigMap holding a CA certificate:
# `[{name: s3-ca, configMap: {name: s3-ca}}]`
extraVolumes: []

# -- Extra volume mounts for the backup and restore containers:
# `[{name: s3-ca, mountPath: /etc/ssl/custom, readOnly: true}]`
extraVolumeMounts: []

# -- Priority class for the backup and restore pods. A backup or restore stops Infrahub while it runs, so a pod
# that is preempted midway leaves Infrahub stopped.
priorityClassName: ""

# -- Node selector for pod scheduling
nodeSelector: {}

# -- Tolerations for pod scheduling
tolerations: []

# -- Affinity rules for pod scheduling
affinity: {}

# -- Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000

# -- Container security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# -- CronJob specific settings
cronJob:
  # -- Concurrency policy: "Forbid", "Replace", or "Allow"
  concurrencyPolicy: Forbid
  # -- Number of successful job history to keep
  successfulJobsHistoryLimit: 3
  # -- Number of failed job history to keep
  failedJobsHistoryLimit: 3
  # -- Job deadline in seconds (optional)
  startingDeadlineSeconds: null
  # -- Suspend the CronJob (useful for maintenance)
  suspend: false
  # -- Time zone for `backup.schedule` and `restore.schedule`, as an IANA name such as "Europe/Zurich". Empty uses
  # the time zone of the kube-controller-manager, usually UTC.
  timeZone: ""

# -- Job specific settings
job:
  # -- Number of retries before marking job as failed
  backoffLimit: 0
  # -- Time to live after job completion (seconds, null to keep indefinitely)
  ttlSecondsAfterFinished: null
  # -- Active deadline in seconds (optional)
  activeDeadlineSeconds: null
