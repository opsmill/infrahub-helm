---
global:
  # -- Kubernetes cluster domain
  kubernetesClusterDomain: cluster.local
  # -- Repository for Infrahub images
  infrahubRepository: opsmill/infrahub
  # -- Default image pull policy
  imagePullPolicy: IfNotPresent
  # -- Image pull secrets
  imagePullSecrets: []
  # -- Labels to use for all installed Kubernetes resources
  commonLabels: {}
  # -- Annotations to use for all installed Kubernetes resources
  commonAnnotations: {}
  # -- Labels to use for all configured pods
  podLabels: {}

# ----------- Cache -----------
redis:
  enabled: true
  nameOverride: cache
  image:
    repository: bitnamilegacy/redis
    tag: 8.2.1-debian-12-r0
  architecture: standalone
  auth:
    enabled: false
  master:
    podLabels:
      infrahub/service: cache
    persistence:
      enabled: false
    service:
      ports:
        redis: 6379

# ----------- Database -----------
neo4j:
  enabled: true
  nameOverride: database
  neo4j:
    name: "infrahub"
    edition: "community"
    labels:
      infrahub/service: database
    password: "admin"
    minimumClusterSize: 1
    acceptLicenseAgreement: "no"
    resources:
      limits:
        cpu: "4"
        memory: "8Gi"
      requests:
        cpu: "2"
        memory: "4Gi"
  volumes:
    data:
      mode: "volume"
      volume:
        emptyDir: {}
  services:
    neo4j:
      enabled: false
      ports:
        bolt:
          enabled: true
          port: 7687
          targetPort: 7687
    admin:
      enabled: false
  config:
    dbms.security.auth_minimum_password_length: "4"
    dbms.security.procedures.unrestricted: apoc.*
  logInitialPassword: false

# ----------- Infrahub Task Worker -----------
infrahubTaskWorker:
  # -- Number of replicas of the Infrahub Task Worker
  replicas: 2
  # -- Resources request and limit to apply for the task worker
  resources: {}
  podLabels:
    infrahub/service: task-worker
  infrahubTaskWorker:
    # -- Container arguments for the task worker
    args:
      - prefect
      - worker
      - start
      - --type
      - infrahubasync
      - --pool
      - infrahub-worker
      - --with-healthcheck
    # -- Container environment for the task worker (list format supports valueFrom/secretKeyRef)
    env:
      - name: INFRAHUB_CACHE_PORT
        value: "6379"
      - name: INFRAHUB_DB_TYPE
        value: "neo4j"
      - name: INFRAHUB_LOG_LEVEL
        value: "DEBUG"
      - name: INFRAHUB_PRODUCTION
        value: "false"
      - name: INFRAHUB_API_TOKEN
        value: "06438eb2-8019-4776-878c-0941b1f1d1ec"
      - name: INFRAHUB_TIMEOUT
        value: "60"
      - name: INFRAHUB_GIT_REPOSITORIES_DIRECTORY
        value: "/opt/infrahub/git"
      - name: INFRAHUB_WORKFLOW_ADDRESS
        value: "prefect-server"
      - name: INFRAHUB_WORKFLOW_PORT
        value: "4200"
      - name: PREFECT_API_URL
        value: "http://prefect-server:4200/api"
      - name: PREFECT_WORKER_QUERY_SECONDS
        value: "3"
      - name: PREFECT_AGENT_QUERY_INTERVAL
        value: "3"
    # -- Image pull policy for the task worker
    imagePullPolicy: Always
    # -- Image registry to use for the task worker
    imageRegistry: registry.opsmill.io
    # -- (DEPRECATED) Name of an existing secret to use for environment variables. Use envFromExistingSecrets instead.
    # @deprecated Use envFromExistingSecrets instead
    envFromExistingSecret: ""
    # -- List of existing secrets to use for environment variables
    envFromExistingSecrets: []
    # -- Extra volumes for the task worker pod
    extraVolumes: []
    # -- Extra volumeMounts for the task worker pod
    extraVolumeMounts: []

# ----------- Infrahub Server -----------
infrahubServer:
  # -- Service type for the Infrahub API server
  podLabels:
    infrahub/service: server
  type: ClusterIP
  ingress:
    # -- Whether to enable Ingress for the Infrahub API server
    enabled: true
    # -- Hostname to configure for the ingress
    hostname: infrahub-cluster.local
    # -- Annotations to configure on the ingress
    annotations:
  # -- Gateway API configuration for the Infrahub API server
  # ref: https://gateway-api.sigs.k8s.io/
  # Mutually exclusive with infrahubServer.ingress
  gatewayApi:
    # -- Whether to enable Gateway API HTTPRoute for the Infrahub API server
    enabled: false
    httpRoute:
      # -- HTTPRoute resource name (defaults to "<fullname>-httproute")
      name: ""
      # -- Additional labels for the HTTPRoute resource
      labels: {}
      # -- Additional annotations for the HTTPRoute resource
      annotations: {}
      # -- Hostnames that this HTTPRoute should match
      hostnames: []
      # -- Parent Gateway references
      parentRefs: []
      # - name: default-gateway
      #   namespace: net
      #   sectionName: https-listener
      # -- Path prefix for the default matching rule
      path: /
      # -- Additional HTTPRoute rules beyond the auto-generated ones
      extraRules: []
    gateway:
      # -- Whether to create a Gateway resource (most users will reference an existing Gateway via httpRoute.parentRefs)
      enabled: false
      # -- GatewayClass name (required when gateway.enabled is true)
      className: ""
      # -- Gateway resource name (defaults to "<fullname>-gateway")
      name: ""
      # -- Additional labels for the Gateway resource
      labels: {}
      # -- Additional annotations for the Gateway resource
      annotations: {}
      # -- Gateway listeners configuration
      listeners: []
      # - name: https
      #   port: 443
      #   protocol: HTTPS
      #   hostname: ""
      #   tls:
      #     mode: Terminate
      #     certificateRefs:
      #       - kind: Secret
      #         name: my-tls-cert
  persistence:
    # -- Whether to enable data persistence for the Infrahub API server
    enabled: true
    size: 1Gi
    accessMode: ReadWriteOnce
  # -- Resources request and limit to apply for the task worker
  resources: {}
  infrahubServer:
    # -- Container arguments for the API server
    args:
      - gunicorn
      - --config
      - /source/backend/infrahub/serve/gunicorn_config.py
      - -w
      - "2"
      - --logger-class
      - infrahub.serve.log.GunicornLogger
      - infrahub.server:app
    # -- Container environment for the API server (list format supports valueFrom/secretKeyRef)
    env:
      - name: INFRAHUB_ALLOW_ANONYMOUS_ACCESS
        value: "true"
      - name: INFRAHUB_CACHE_PORT
        value: "6379"
      - name: INFRAHUB_DB_TYPE
        value: "neo4j"
      - name: INFRAHUB_LOG_LEVEL
        value: "INFO"
      - name: INFRAHUB_PRODUCTION
        value: "false"
      - name: INFRAHUB_INITIAL_ADMIN_TOKEN
        value: "06438eb2-8019-4776-878c-0941b1f1d1ec"
      - name: INFRAHUB_SECURITY_SECRET_KEY
        value: "327f747f-efac-42be-9e73-999f08f86b92"
      - name: INFRAHUB_GIT_REPOSITORIES_DIRECTORY
        value: "/opt/infrahub/git"
      - name: INFRAHUB_WORKFLOW_ADDRESS
        value: "prefect-server"
      - name: INFRAHUB_WORKFLOW_PORT
        value: "4200"
      - name: PREFECT_API_URL
        value: "http://prefect-server:4200/api"
    # -- Image pull policy for the API server
    imagePullPolicy: Always
    # -- Image registry to use for the API server
    imageRegistry: registry.opsmill.io
    # -- (DEPRECATED) Name of an existing secret to use for environment variables. Use envFromExistingSecrets instead.
    # @deprecated Use envFromExistingSecrets instead
    envFromExistingSecret: ""
    # -- List of existing secrets to use for environment variables
    envFromExistingSecrets: []
    # -- Liveness probe to use for the API server
    livenessProbe:
      httpGet:
        path: /api/config
        port: 8000
        scheme: HTTP
      failureThreshold: 20
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 5
    # -- Readiness probe to use for the API server
    readinessProbe:
      httpGet:
        path: /api/config
        port: 8000
        scheme: HTTP
      failureThreshold: 20
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 5
    # -- Extra volumes for the server pod
    extraVolumes: []
    # -- Extra volumeMounts for the server pod
    extraVolumeMounts: []

  ports:
    - name: "interface"
      # -- Port on which to expose the API server service
      port: 8000
      # -- Port on which Infrahub API server listens
      targetPort: 8000

infrahubDemoData:
  # -- Whether to enable loading of demo data
  enabled: false
  # -- Backoff limit for the Kubernetes job that will load the data
  backoffLimit: 4
  # -- Image registry to use for the Kubernetes job
  imageRegistry: registry.opsmill.io
  # -- Container environment for demo data loading (list format supports valueFrom/secretKeyRef)
  env:
    - name: INFRAHUB_API_TOKEN
      value: "06438eb2-8019-4776-878c-0941b1f1d1ec"
  # -- Container entrypoint for the demo data loading job
  command:
    - sh
    - -c
    - "infrahubctl schema load models/base --wait 30 && infrahubctl run models/infrastructure_edge.py && infrahubctl menu
      load models/base_menu.yml && infrahubctl repository add demo-edge https://github.com/opsmill/infrahub-demo-edge --read-only"

# ----------- Mesage Queue (Rabbit MQ) -----------
rabbitmq:
  podLabels:
    infrahub/service: message-queue
  enabled: true
  nameOverride: message-queue
  image:
    repository: bitnamilegacy/rabbitmq
    tag: 4.1.3-debian-12-r1
  persistence:
    enabled: false
  auth:
    username: infrahub
    password: infrahub
  metrics:
    enabled: true
  startupProbe:
    enabled: true

# ----------- NATS Server -----------
nats:
  enabled: false
  config:
    jetstream:
      enabled: true

# ------------- Prefect -------------
prefect-server:
  enabled: true
  global:
    prefect:
      image:
        repository: registry.opsmill.io/opsmill/infrahub
        prefectTag: 1.7.6
  server:
    command:
      - /usr/bin/tini
      - -g
      - --
    args:
      - uvicorn
      - --host
      - "0.0.0.0"
      - --port
      - "4200"
      - --factory
      - infrahub.prefect_server.app:create_infrahub_prefect
    env:
      - name: PREFECT_UI_SERVE_BASE
        value: /
    podLabels:
      infrahub/service: task-manager
  serviceAccount:
    create: false
  postgresql:
    enabled: true
    image:
      repository: bitnamilegacy/postgresql
    primary:
      podLabels:
        infrahub/service: task-manager-db
      persistence:
        enabled: false

# -------------- Emma ---------------
emma:
  imageRegistry: registry.opsmill.io
  imageName: opsmill/emma
  version: latest
  type: ClusterIP
  # -- Base URL path for the Streamlit server (used in probes, ingress, and httproute)
  streamlitBasePath: /emma
  # -- Container environment for Emma (list format supports valueFrom/secretKeyRef)
  env:
    - name: STREAMLIT_SERVER_BASE_URL_PATH
      value: "/emma"
  ports:
    - name: "interface"
      port: 8501
      targetPort: 8501

# -------------- Infrahub Backup ---------------
infrahub-backup:
  # -- Whether to enable Infrahub Backup
  enabled: false

  # -- Backup configuration
  backup:
    enabled: false
    mode: "cronjob"  # "job" or "cronjob"
    schedule: "0 2 * * *"
    storage:
      type: "s3"
      s3:
        bucket: ""
        prefix: ""
        endpoint: ""
        region: "us-east-1"
        secretName: ""

  # --Restore configuration
  restore:
    enabled: false
    s3:
      bucket: ""
      key: ""
      endpoint: ""
      region: "us-east-1"
      secretName: ""
