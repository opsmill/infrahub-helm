---
global:
  # -- Kubernetes cluster domain
  kubernetesClusterDomain: cluster.local
  # -- Repository for Infrahub images
  infrahubRepository: opsmill/infrahub
  # -- Default image pull policy
  imagePullPolicy: IfNotPresent
  # -- Image pull secrets
  imagePullSecrets: []
  # -- Labels to use for all installed Kubernetes resources
  commonLabels: {}
  # -- Annotations to use for all installed Kubernetes resources
  commonAnnotations: {}
  # -- Labels to use for all configured pods
  podLabels: {}
  # -- Send traces to an OTLP collector. When enabled, INFRAHUB_TRACE_* env
  # vars are injected into the server and task-worker Deployments. Implied
  # true when the bundled Tempo collector is deployed (i.e. both
  # `infrahub-observability.enabled` and `infrahub-observability.tempo.enabled`
  # are true). Pair with the infrahub-observability chart (Tempo endpoint:
  # <release>-tempo:4317) or any other OTLP-compatible collector.
  tracing:
    # -- Enable tracing instrumentation on server and task-worker pods.
    # Implied true when the bundled Tempo collector is deployed. Disabling
    # `infrahub-observability.tempo` (e.g. to export to an external OTLP
    # collector) leaves this as the sole switch: set it true and provide
    # `endpoint` for your own collector, or keep it false to inject nothing.
    enabled: false
    # -- OTLP endpoint. For grpc protocol, use host:port (no scheme).
    # For http/protobuf, use a full URL. Example: "obs-tempo:4317".
    # When empty and the bundled Tempo collector is deployed, defaults to
    # "<release>-tempo:4317".
    endpoint: ""
    # -- OTLP protocol. One of: grpc, http/protobuf.
    protocol: grpc
    # -- Skip TLS verification when talking to the collector.
    insecure: true

# -- ServiceAccount configuration for the Infrahub pods
serviceAccount:
  # -- Create a ServiceAccount for the Infrahub pods
  create: false
  # -- Name of the ServiceAccount to use (auto-generated if empty and create is true; if empty and create is false, the field is omitted from pod specs)
  name: ""
  # -- Annotations to add to the ServiceAccount
  annotations: {}

# ----------- Cache -----------
# Resource presets: nano, micro, small, medium, large, xlarge, 2xlarge
# https://github.com/bitnami/charts/blob/main/bitnami/common/templates/_resources.tpl
redis:
  enabled: true
  nameOverride: cache
  image:
    repository: bitnamilegacy/redis
    tag: 8.2.1-debian-12-r0
  architecture: standalone
  auth:
    enabled: false
  master:
    resourcesPreset: "medium"
    podLabels:
      infrahub/service: cache
    persistence:
      enabled: false
    service:
      ports:
        redis: 6379

# ----------- Database -----------
neo4j:
  enabled: true
  nameOverride: database
  neo4j:
    name: "infrahub"
    edition: "community"
    labels:
      infrahub/service: database
    password: "admin"
    minimumClusterSize: 1
    acceptLicenseAgreement: "no"
    resources:
      # Neo4j's chart forces limits == requests when 'limits' is unset (nil).
      # An explicit empty map is the only way to render the container with no
      # resource limits, allowing Neo4j to burst above its requested memory.
      limits: {}
      requests:
        cpu: "2"
        memory: "4Gi"
  volumes:
    data:
      mode: "volume"
      volume:
        emptyDir: {}
  services:
    neo4j:
      enabled: false
      ports:
        bolt:
          enabled: true
          port: 7687
          targetPort: 7687
    admin:
      enabled: false
  config:
    dbms.security.auth_minimum_password_length: "4"
    dbms.security.procedures.unrestricted: apoc.*
  logInitialPassword: false

# ----------- Infrahub Task Worker -----------
infrahubTaskWorker:
  # -- Number of replicas of the Infrahub Task Worker
  replicas: 2
  # -- Revision history limit for the task worker Deployment
  revisionHistoryLimit: 10
  # -- Resources request and limit to apply for the task worker
  resources: {}
  # -- Priority class name for the task worker pods
  priorityClassName: ""
  # -- Node selector for the task worker pods
  nodeSelector: {}
  # -- Affinity for the task worker pods
  affinity: {}
  # -- Tolerations for the task worker pods
  tolerations: []
  # -- Topology spread constraints for the task worker pods
  topologySpreadConstraints: []
  # -- Pod security context for the task worker pods
  podSecurityContext: {}
  # -- Pod labels for the task worker pods
  podLabels:
    infrahub/service: task-worker
  infrahubTaskWorker:
    # -- Container arguments for the task worker
    args:
      - prefect
      - worker
      - start
      - --type
      - infrahubasync
      - --pool
      - infrahub-worker
      - --with-healthcheck
    # -- Container environment for the task worker
    env:
      INFRAHUB_CACHE_PORT: 6379
      INFRAHUB_DB_TYPE: neo4j
      INFRAHUB_LOG_LEVEL: DEBUG
      INFRAHUB_PRODUCTION: "false"
      INFRAHUB_API_TOKEN: 06438eb2-8019-4776-878c-0941b1f1d1ec
      INFRAHUB_INITIAL_AGENT_TOKEN: 44af444d-3b26-410d-9546-b758657e026c
      INFRAHUB_TIMEOUT: "60"
      INFRAHUB_GIT_REPOSITORIES_DIRECTORY: "/opt/infrahub/git"
      INFRAHUB_WORKFLOW_ADDRESS: prefect-server
      INFRAHUB_WORKFLOW_PORT: 4200
      PREFECT_API_URL: "http://prefect-server:4200/api"
      PREFECT_WORKER_QUERY_SECONDS: 3
      PREFECT_AGENT_QUERY_INTERVAL: 3
    # -- Image pull policy for the task worker
    imagePullPolicy: Always
    # -- Image registry to use for the task worker
    imageRegistry: registry.opsmill.io
    # -- (DEPRECATED) Name of an existing secret to use for environment variables. Use envFromExistingSecrets instead.
    # @deprecated Use envFromExistingSecrets instead
    envFromExistingSecret: ""
    # -- List of existing secrets to use for environment variables
    envFromExistingSecrets: []
    # -- Whether to allocate a TTY for the task worker container
    tty: false
    # -- Extra volumes for the task worker pod
    extraVolumes: []
    # -- Extra volumeMounts for the task worker pod
    extraVolumeMounts: []

# ----------- Infrahub Server -----------
infrahubServer:
  # -- Number of replicas of the Infrahub API server
  replicas: 1
  # -- Revision history limit for the server Deployment
  revisionHistoryLimit: 10
  # -- Resources request and limit to apply for the Infrahub API server
  resources: {}
  # -- Priority class name for the server pods
  priorityClassName: ""
  # -- Node selector for the server pods
  nodeSelector: {}
  # -- Affinity for the server pods
  affinity: {}
  # -- Tolerations for the server pods
  tolerations: []
  # -- Topology spread constraints for the server pods
  topologySpreadConstraints: []
  # -- Pod security context for the server pods
  podSecurityContext: {}
  # -- Pod labels for the server pods
  podLabels:
    infrahub/service: server
  # -- @deprecated Use `infrahubServer.service.ports` instead. This field will be removed in a future release.
  ports: []
  # -- @deprecated Use `infrahubServer.service.type` instead. This field will be removed in a future release.
  type: ""
  service:
    # -- Service type for the Infrahub API server
    type: ClusterIP
    ports:
      - name: "interface"
        # -- Port on which to expose the API server service
        port: 8000
        # -- Port on which Infrahub API server listens
        targetPort: 8000
  ingress:
    # -- Whether to enable Ingress for the Infrahub API server
    enabled: true
    # -- Hostname to configure for the ingress
    hostname: infrahub-cluster.local
    # -- Annotations to configure on the ingress
    annotations:
  # -- Gateway API configuration for the Infrahub API server
  # ref: https://gateway-api.sigs.k8s.io/
  # Mutually exclusive with infrahubServer.ingress
  gatewayApi:
    # -- Whether to enable Gateway API HTTPRoute for the Infrahub API server
    enabled: false
    httpRoute:
      # -- HTTPRoute resource name (defaults to "<fullname>-httproute")
      name: ""
      # -- Additional labels for the HTTPRoute resource
      labels: {}
      # -- Additional annotations for the HTTPRoute resource
      annotations: {}
      # -- Hostnames that this HTTPRoute should match
      hostnames: []
      # -- Parent Gateway references
      parentRefs: []
      # - name: default-gateway
      #   namespace: net
      #   sectionName: https-listener
      # -- Path prefix for the default matching rule
      path: /
      # -- Additional HTTPRoute rules beyond the auto-generated ones
      extraRules: []
    gateway:
      # -- Whether to create a Gateway resource (most users will reference an existing Gateway via httpRoute.parentRefs)
      enabled: false
      # -- GatewayClass name (required when gateway.enabled is true)
      className: ""
      # -- Gateway resource name (defaults to "<fullname>-gateway")
      name: ""
      # -- Additional labels for the Gateway resource
      labels: {}
      # -- Additional annotations for the Gateway resource
      annotations: {}
      # -- Gateway listeners configuration
      listeners: []
      # - name: https
      #   port: 443
      #   protocol: HTTPS
      #   hostname: ""
      #   tls:
      #     mode: Terminate
      #     certificateRefs:
      #       - kind: Secret
      #         name: my-tls-cert
  persistence:
    # -- Whether to enable data persistence for the Infrahub API server
    enabled: true
    size: 1Gi
    accessMode: ReadWriteOnce
  infrahubServer:
    # -- Container arguments for the API server
    args:
      - gunicorn
      - --config
      - /source/backend/infrahub/serve/gunicorn_config.py
      - -w
      - "2"
      - --logger-class
      - infrahub.serve.log.GunicornLogger
      - infrahub.server:app
    # -- Container environment for the API server
    env:
      INFRAHUB_ALLOW_ANONYMOUS_ACCESS: "true"
      INFRAHUB_CACHE_PORT: 6379
      INFRAHUB_DB_TYPE: neo4j
      INFRAHUB_LOG_LEVEL: INFO
      INFRAHUB_PRODUCTION: "false"
      INFRAHUB_INITIAL_ADMIN_TOKEN: 06438eb2-8019-4776-878c-0941b1f1d1ec
      INFRAHUB_INITIAL_AGENT_TOKEN: 44af444d-3b26-410d-9546-b758657e026c
      INFRAHUB_SECURITY_SECRET_KEY: 327f747f-efac-42be-9e73-999f08f86b92
      INFRAHUB_GIT_REPOSITORIES_DIRECTORY: "/opt/infrahub/git"
      INFRAHUB_WORKFLOW_ADDRESS: prefect-server
      INFRAHUB_WORKFLOW_PORT: 4200
      PREFECT_API_URL: "http://prefect-server:4200/api"
    # -- Image pull policy for the API server
    imagePullPolicy: Always
    # -- Image registry to use for the API server
    imageRegistry: registry.opsmill.io
    # -- (DEPRECATED) Name of an existing secret to use for environment variables. Use envFromExistingSecrets instead.
    # @deprecated Use envFromExistingSecrets instead
    envFromExistingSecret: ""
    # -- List of existing secrets to use for environment variables
    envFromExistingSecrets: []
    # -- Startup probe to use for the API server. Gates the liveness and readiness probes so a slow start is not mistaken for a hung process. Startup can take several minutes when dozens of active branches with different schemas are present, which slows down the start process. failureThreshold * periodSeconds = 300s (5 min) startup budget.
    startupProbe:
      httpGet:
        path: /api/config
        port: 8000
        scheme: HTTP
      failureThreshold: 60
      periodSeconds: 5
      timeoutSeconds: 5
    # -- Liveness probe to use for the API server
    livenessProbe:
      httpGet:
        path: /api/config
        port: 8000
        scheme: HTTP
      failureThreshold: 20
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 5
    # -- Readiness probe to use for the API server
    readinessProbe:
      httpGet:
        path: /api/config
        port: 8000
        scheme: HTTP
      failureThreshold: 20
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 5
    # -- Whether to allocate a TTY for the API server container
    tty: false
    # -- Extra volumes for the server pod
    extraVolumes: []
    # -- Extra volumeMounts for the server pod
    extraVolumeMounts: []


# ----------- Infrahub Upgrade -----------
upgrade:
  # -- Whether to run infrahub upgrade as a post-install/pre-upgrade hook job
  enabled: false

infrahubDemoData:
  # -- Whether to enable loading of demo data
  enabled: false
  # -- Backoff limit for the Kubernetes job that will load the data
  backoffLimit: 4
  # -- Image registry to use for the Kubernetes job
  imageRegistry: registry.opsmill.io
  # -- Resources request and limit to apply for the demo data job
  resources: {}
  # -- Priority class name for the demo data job pod
  priorityClassName: ""
  # -- Node selector for the demo data job pod
  nodeSelector: {}
  # -- Affinity for the demo data job pod
  affinity: {}
  # -- Tolerations for the demo data job pod
  tolerations: []
  # -- Pod security context for the demo data job pod
  podSecurityContext: {}
  # -- Container security context for the demo data job container
  securityContext: {}
  env:
    # -- Infrahub API token that will be used when loading the data
    INFRAHUB_API_TOKEN: 06438eb2-8019-4776-878c-0941b1f1d1ec
  # -- Container entrypoint for the demo data loading job
  command:
    - sh
    - -c
    - "infrahubctl schema load models/base --wait 30 && infrahubctl run models/infrastructure_edge.py && infrahubctl menu
      load models/base_menu.yml && infrahubctl repository add demo-edge https://github.com/opsmill/infrahub-demo-edge --read-only"

# ----------- Mesage Queue (Rabbit MQ) -----------
rabbitmq:
  podLabels:
    infrahub/service: message-queue
  enabled: true
  nameOverride: message-queue
  image:
    repository: bitnamilegacy/rabbitmq
    tag: 4.1.3-debian-12-r1
  persistence:
    enabled: false
  auth:
    username: infrahub
    password: infrahub
  metrics:
    enabled: true
  startupProbe:
    enabled: true

# ----------- NATS Server -----------
nats:
  enabled: false
  config:
    jetstream:
      enabled: true

# ------------- Prefect -------------
prefect-server:
  enabled: true
  global:
    prefect:
      image:
        repository: registry.opsmill.io/opsmill/infrahub
        prefectTag: 1.10.0
  server:
    command:
      - /usr/bin/tini
      - -g
      - --
    args:
      - uvicorn
      - --host
      - "0.0.0.0"
      - --port
      - "4200"
      - --factory
      - infrahub.prefect_server.app:create_infrahub_prefect
    env:
      - name: PREFECT_UI_SERVE_BASE
        value: /
      # The Infrahub image bakes PROMETHEUS_MULTIPROC_DIR to /prom_shared, a
      # root-owned directory on the root filesystem. The prefect-server pod runs
      # as a non-root user with a read-only root filesystem (the prefect-helm
      # defaults), so prometheus_client cannot create its multiprocess metric
      # files there and the container crash-loops on startup, blocking the task
      # worker and the Infrahub server that wait for it. Point the multiprocess
      # dir at the writable /tmp mount prefect-helm already provides.
      - name: PROMETHEUS_MULTIPROC_DIR
        value: /tmp
    podLabels:
      infrahub/service: task-manager
  serviceAccount:
    create: false
  postgresql:
    enabled: true
    image:
      repository: bitnamilegacy/postgresql
    primary:
      podLabels:
        infrahub/service: task-manager-db
      persistence:
        enabled: false

# -------------- Emma ---------------
emma:
  # -- Whether to enable Emma
  enabled: false
  imageRegistry: registry.opsmill.io
  imageName: opsmill/emma
  version: latest
  type: ClusterIP
  # -- Revision history limit for the emma Deployment
  revisionHistoryLimit: 10
  # -- Resources request and limit to apply for emma
  resources: {}
  # -- Priority class name for the emma pods
  priorityClassName: ""
  # -- Node selector for the emma pods
  nodeSelector: {}
  # -- Affinity for the emma pods
  affinity: {}
  # -- Tolerations for the emma pods
  tolerations: []
  # -- Topology spread constraints for the emma pods
  topologySpreadConstraints: []
  # -- Pod security context for the emma pods
  podSecurityContext: {}
  # -- Container security context for the emma container
  securityContext: {}
  # -- Whether to allocate a TTY for the emma container
  tty: false
  env:
    STREAMLIT_SERVER_BASE_URL_PATH: /emma
  ports:
    - name: "interface"
      port: 8501
      targetPort: 8501

# -------------- Infrahub Backup ---------------
infrahub-backup:
  # -- Whether to enable Infrahub Backup
  enabled: false

  # -- Backup configuration
  backup:
    enabled: false
    mode: "cronjob"  # "job" or "cronjob"
    schedule: "0 2 * * *"
    storage:
      type: "s3"
      s3:
        bucket: ""
        prefix: ""
        endpoint: ""
        region: "us-east-1"
        secretName: ""

  # --Restore configuration
  restore:
    enabled: false
    s3:
      bucket: ""
      key: ""
      endpoint: ""
      region: "us-east-1"
      secretName: ""

# -------------- Infrahub Observability ---------------
# Bundled observability stack (Alloy / Loki / Tempo / Prometheus / Grafana).
# When the bundled Tempo collector is deployed, tracing env vars are also
# injected on server and task-worker pods and default to the bundled Tempo
# service unless `global.tracing.endpoint` is set explicitly. Set
# `tempo.enabled: false` to run the rest of the stack (e.g. only the Prefect
# exporter) without those env vars — traces then go wherever `global.tracing`
# points, or nowhere. Subchart values can be overridden under this block.
infrahub-observability:
  # -- Deploy the infrahub-observability subchart. Implies tracing on only
  # when its bundled Tempo collector (`tempo.enabled`, default true) is kept.
  enabled: false
  # tempo:
  #   # -- Set to false to skip the bundled Tempo collector and stop tracing
  #   # env vars from being injected into server and task-worker pods.
  #   enabled: false

# -------------- Infrahub MCP Server ---------------
# Optional MCP server for Infrahub, disabled by default. The Infrahub
# connection is not wired automatically: set `infrahub.address` to the
# in-cluster server URL and provide an API token. See
# charts/infrahub-mcp/values.yaml for the full set of options.
infrahub-mcp:
  # -- Whether to enable Infrahub MCP Server
  enabled: false

  # -- Infrahub connection for the MCP server. Set `address` to the in-cluster
  # Infrahub URL (e.g. "http://<release>-infrahub-server:8000") and provide an
  # API token via `apiToken.value` or `apiToken.existingSecret`.
  infrahub:
    address: ""
    apiToken:
      value: ""

  # -- MCP server settings
  mcp:
    authMode: "none"
    readOnly: false
    logLevel: "info"
