{{- if and .Values.infrahubServer.gatewayApi.enabled .Values.infrahubServer.gatewayApi.gateway.enabled }}
{{- if not .Values.infrahubServer.gatewayApi.gateway.className }}
  {{- fail "infrahubServer.gatewayApi.gateway.className is required when gateway.enabled is true." }}
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "infrahub-helm.gateway.name" . }}
  namespace: "{{ .Release.Namespace }}"
  labels:
  {{- include "infrahub-helm.labels" . | nindent 4 }}
  {{- with .Values.infrahubServer.gatewayApi.gateway.labels }}
  {{- toYaml . | nindent 4 }}
  {{- end }}
  annotations:
  {{- include "infrahub-helm.annotations" . | nindent 4 }}
  {{- with .Values.infrahubServer.gatewayApi.gateway.annotations }}
  {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  gatewayClassName: {{ .Values.infrahubServer.gatewayApi.gateway.className | quote }}
  {{- with .Values.infrahubServer.gatewayApi.gateway.listeners }}
  listeners:
  {{- range . }}
  - name: {{ .name }}
    port: {{ .port }}
    protocol: {{ .protocol }}
    {{- if .hostname }}
    hostname: {{ .hostname | quote }}
    {{- end }}
    {{- if .tls }}
    tls:
      mode: {{ .tls.mode | default "Terminate" }}
      {{- with .tls.certificateRefs }}
      certificateRefs:
      {{- toYaml . | nindent 6 }}
      {{- end }}
    {{- end }}
  {{- end }}
  {{- end }}
{{- end }}
