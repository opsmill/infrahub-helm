---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "infrahub-helm.fullname" . }}-infrahub-task-worker
  namespace: "{{ .Release.Namespace }}"
  labels:
    service: infrahub-task-worker
  {{- include "infrahub-helm.labels" . | nindent 4 }}
  annotations:
  {{- include "infrahub-helm.annotations" . | nindent 4 }}
spec:
  replicas: {{ .Values.infrahubTaskWorker.replicas | default 2 }}
  {{- with .Values.infrahubTaskWorker.revisionHistoryLimit }}
  revisionHistoryLimit: {{ . }}
  {{- end }}
  selector:
    matchLabels:
      service: infrahub-task-worker
    {{- include "infrahub-helm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        service: infrahub-task-worker
      {{- with .Values.infrahubTaskWorker.podLabels }}
      {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "infrahub-helm.selectorLabels" . | nindent 8 }}
      {{- with .Values.infrahubTaskWorker.podAnnotations }}
      annotations:
      {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.infrahubTaskWorker.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.infrahubTaskWorker.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.infrahubTaskWorker.runtimeClassName }}
      runtimeClassName: {{ . }}
      {{- end }}
      {{- with .Values.infrahubTaskWorker.podSecurityContext }}
      securityContext: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.infrahubTaskWorker.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.infrahubTaskWorker.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.infrahubTaskWorker.topologySpreadConstraints }}
      topologySpreadConstraints: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: infrahub-task-worker
          args: {{- toYaml .Values.infrahubTaskWorker.infrahubTaskWorker.args | nindent 12 }}
          env:
            {{- include "infrahub-helm.infrahubTaskWorker.defaultEnv" . | nindent 12 }}
            {{- range $key, $value := .Values.infrahubTaskWorker.infrahubTaskWorker.env }}
            {{- if or $value (not (or (eq $key "INFRAHUB_INITIAL_ADMIN_TOKEN") (eq $key "INFRAHUB_INITIAL_AGENT_TOKEN") (eq $key "INFRAHUB_SECURITY_SECRET_KEY") (eq $key "INFRAHUB_API_TOKEN"))) }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
          {{- if and .Values.infrahubTaskWorker.infrahubTaskWorker.envFromExistingSecret .Values.infrahubTaskWorker.infrahubTaskWorker.envFromExistingSecrets }}
            {{- fail "infrahubTaskWorker.infrahubTaskWorker.envFromExistingSecret and infrahubTaskWorker.infrahubTaskWorker.envFromExistingSecrets are mutually exclusive. Please use envFromExistingSecrets (envFromExistingSecret is deprecated)." }}
          {{- end }}
          {{- if or .Values.infrahubTaskWorker.infrahubTaskWorker.envFromExistingSecret .Values.infrahubTaskWorker.infrahubTaskWorker.envFromExistingSecrets }}
          envFrom:
            {{- with .Values.infrahubTaskWorker.infrahubTaskWorker.envFromExistingSecret }}
            - secretRef:
                name: {{ . }}
            {{- end }}
            {{- range .Values.infrahubTaskWorker.infrahubTaskWorker.envFromExistingSecrets }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          {{- end }}
          image: {{ default .Values.global.imageRegistry .Values.infrahubTaskWorker.infrahubTaskWorker.imageRegistry }}/{{ .Values.global.infrahubRepository }}:{{ .Values.global.infrahubTag | default .Chart.AppVersion }}
          imagePullPolicy: {{ default .Values.global.imagePullPolicy .Values.infrahubTaskWorker.infrahubTaskWorker.imagePullPolicy }}
          {{- with .Values.infrahubTaskWorker.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.infrahubTaskWorker.infrahubTaskWorker.securityContext }}
          securityContext: {{- toYaml . | nindent 12 }}
          {{- end }}
          tty: true
          {{- with .Values.infrahubTaskWorker.infrahubTaskWorker.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      restartPolicy: Always
      {{- with .Values.infrahubTaskWorker.infrahubTaskWorker.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}