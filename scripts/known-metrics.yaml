# Metric inventory for scripts/validate_dashboards.py
#
# The validator uses prefix-matching to verify that every metric referenced
# in a dashboard plausibly comes from one of our collected sources. This
# isn't strict membership testing — adding a new dashboard that references
# `loki_some_new_metric_total` doesn't require updating this file because
# the `loki_*` prefix is already accepted.
#
# Update this file when:
# 1. The chart starts (or stops) scraping a new metrics source.
# 2. A new third-party subchart appears with its own metric prefix.

# Metric-name prefixes accepted as "we collect this".
# Each entry is a glob ("*" wildcard) matched against the full metric name.
collected_prefixes:
  # === Our own scrapes (Alloy → Prometheus remote_write) ===
  - infrahub_*               # infrahub-server :8000/metrics
  - prefect_*                # Prefect exporter (this chart) + Prefect server :4200/api/metrics
  - container_*              # kubelet /metrics/cadvisor (Section 1)
  - machine_*                # kubelet /metrics/cadvisor (machine-info)
  - node_*                   # prometheus-node-exporter
  - rabbitmq_*               # rabbit prom exporter on :9419
  - erlang_*                 # rabbit (Erlang VM stats)
  # === Subchart internals (collected via Alloy scraping each component's metrics endpoint) ===
  - loki_*                   # Loki itself
  - tempo_*                  # Tempo itself
  - logql_*                  # Loki query engine
  - cortex_*                 # Loki/Tempo bits inherited from Cortex
  - alloy_*                  # Alloy self-monitoring
  - prometheus_*             # Prometheus itself
  - querier_*                # Loki querier internals (unprefixed)
  - ring_*                   # Loki ring internals (unprefixed)
  - deprecated_flags_*       # Loki deprecation counters
  # === Standard process/runtime metrics emitted by most Go/Python services ===
  - go_*
  - process_*
  - python_*
  # === Prometheus per-scrape internals ===
  - up
  - scrape_*

# Forbidden tokens. Any occurrence in a dashboard `expr` (after the transform
# pipeline runs) is a hard CI failure — they signal the transform script
# missed something or upstream introduced a new pattern.
denied_tokens:
  - container_label_com_docker_compose_service
  - container_label_com_docker_compose_project
  - container_label_com_docker_compose_oneoff
  - container_label_com_docker_compose_container_number
