---
# yamllint disable rule:truthy
name: Build RabbitMQ image

# Builds images/rabbitmq and publishes it under the repository and tag the
# infrahub chart sets in rabbitmq.image, so the chart and the published image
# use the same reference. Pull requests only build the image; a manual run with
# `push` publishes it.
#
# The image is pushed to vars.HARBOR_HOST, not to rabbitmq.image.registry:
# registry credentials are scoped to the host they log in to, and the chart's
# registry is another name for the same registry.
#
# A tag that already exists is never overwritten: the chart pulls with
# IfNotPresent, so nodes that already hold the tag would keep running the old
# image. Raise rabbitmq.image.tag (e.g. -opsmill.2) for every rebuild.
on:
  pull_request:
    paths:
      - "images/rabbitmq/**"
      - ".github/workflows/build-rabbitmq-image.yml"
  workflow_dispatch:
    inputs:
      push:
        description: Push the image to the Infrahub private registry
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Read the image reference from the infrahub chart
        id: image
        uses: mikefarah/yq@065b200af9851db0d5132f50bc10b1406ea5c0a8 # v4.50.1
        with:
          cmd: yq '"${{ vars.HARBOR_HOST || 'registry.opsmill.io' }}/" + (.rabbitmq.image | .repository + ":" + .tag)' charts/infrahub/values.yaml

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login to the registry
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.HARBOR_HOST }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Refuse to overwrite an existing tag
        if: ${{ inputs.push }}
        env:
          IMAGE: ${{ steps.image.outputs.result }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "::error::$IMAGE already exists. Raise rabbitmq.image.tag in charts/infrahub/values.yaml."
            exit 1
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: images/rabbitmq
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push == true }}
          tags: ${{ steps.image.outputs.result }}
