---
# yamllint disable rule:truthy rule:line-length
name: "Update infrahub-sync"

# Opens a pull request that moves charts/infrahub-sync to a new infrahub-sync
# release: it sets appVersion, bumps the chart version and adds a news fragment
# (scripts/bump_chart.py).
#
# opsmill/infrahub-sync sends the `infrahub-sync-released` repository_dispatch
# event, with {"version": "<tag>"} as client_payload, after it publishes a
# release and its container image. Run this workflow by hand for a release that
# did not send the event. An infrahub-sync release tag has no `v` prefix
# (`3.0.0`), and the image tag is the release tag.
#
# scripts/bump_chart.py refuses to move appVersion from a pre-release such as
# `3.0.0a5`, so until appVersion is a final release, a maintainer sets it by hand.
#
# After the pull request is merged, run "Publish Helm Chart" for infrahub-sync.
#
# A pull request opened with the default GITHUB_TOKEN does not trigger the CI
# workflow (GitHub suppresses it to avoid loops). Set the RELEASE_PAT secret,
# as for publish-helm-chart.yml, so that CI runs on the pull request.
on:
  repository_dispatch:
    types: [infrahub-sync-released]
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: "infrahub-sync release tag, for example 3.0.0"
        required: true

concurrency:
  group: update-infrahub-sync
  cancel-in-progress: false

jobs:
  open-pull-request:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      # Read from env, never interpolated into a script, because the dispatch
      # payload is supplied by the caller.
      VERSION: ${{ github.event.client_payload.version || inputs.version }}
      BRANCH: infrahub-sync/${{ github.event.client_payload.version || inputs.version }}
      GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
    steps:
      - name: Validate the release
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not a final infrahub-sync release tag (MAJOR.MINOR.PATCH, no v prefix)"; exit 1
          fi
          if [ "$(gh release view "$VERSION" -R opsmill/infrahub-sync --json isPrerelease -q .isPrerelease)" != "false" ]; then
            echo "::error::$VERSION is not a published, final release of opsmill/infrahub-sync"; exit 1
          fi
          if ! docker manifest inspect "registry.opsmill.io/opsmill/infrahub-sync:$VERSION" >/dev/null; then
            echo "::error::The image registry.opsmill.io/opsmill/infrahub-sync:$VERSION does not exist"; exit 1
          fi

      - name: Check out stable
        uses: actions/checkout@v5
        with:
          ref: stable
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Check whether the update is already done or proposed
        id: state
        run: |
          set -euo pipefail
          if grep -qE "^appVersion: \"?${VERSION}\"?$" charts/infrahub-sync/Chart.yaml; then
            echo "::notice::charts/infrahub-sync already has appVersion $VERSION"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "::notice::Branch $BRANCH already exists; its pull request proposes this update"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update the chart
        id: update
        if: steps.state.outputs.skip == 'false'
        run: |
          set -euo pipefail
          CHART_VERSION=$(python3 scripts/bump_chart.py app-version infrahub-sync "$VERSION" \
            --notes-url "https://github.com/opsmill/infrahub-sync/releases/tag/$VERSION")
          echo "chart_version=$CHART_VERSION" >> "$GITHUB_OUTPUT"

      - name: Open the pull request
        if: steps.state.outputs.skip == 'false'
        env:
          CHART_VERSION: ${{ steps.update.outputs.chart_version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A charts/infrahub-sync
          git commit -m "chore(infrahub-sync): update to infrahub-sync $VERSION"
          git push origin "$BRANCH"

          {
            echo "Updates \`charts/infrahub-sync\` to [infrahub-sync $VERSION](https://github.com/opsmill/infrahub-sync/releases/tag/$VERSION):"
            echo
            echo "- \`appVersion\`: \`$VERSION\`"
            echo "- chart \`version\`: \`$CHART_VERSION\`"
            echo "- a news fragment in \`charts/infrahub-sync/changelog/\`"
            echo
            echo "## Before merging"
            echo
            echo "- Read the release notes for new settings, changed defaults and upgrade notes."
            echo "- When you add values, update \`README.md\` with helm-docs and add an \`added\` news fragment."
            echo "- After merging, run \"Publish Helm Chart\" for \`infrahub-sync\`."
          } > "$RUNNER_TEMP/body.md"

          gh pr create --base stable --head "$BRANCH" \
            --title "chore(infrahub-sync): update to infrahub-sync $VERSION" \
            --body-file "$RUNNER_TEMP/body.md"
