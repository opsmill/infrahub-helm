---
# yamllint disable rule:truthy
name: Changelog

# A release is assembled from news fragments, so every pull request that
# changes behaviour must carry one. Failing here — rather than at release
# time — puts the cost on the author while they still have the context,
# instead of on whoever cuts the release.
#
# Scoped to `stable`, this repository's only long-lived branch.
#
# Fragments live per chart, not at the repository root: each chart under
# charts/ owns a towncrier.toml, its own changelog/ directory and its own
# CHANGELOG.md, and publish-helm-chart.yml releases charts independently.
# A fragment in the root changelog/ directory would never be assembled into
# anything — that directory holds only the template the charts share.
# ROLLBACK 2026-09-16: the news-fragment gate is disabled while the towncrier
# rollout is reconsidered. The check below is left intact — only its trigger is
# commented out. To restore: uncomment the `pull_request:` block and drop
# `workflow_dispatch:`.
on:
  workflow_dispatch:
  # pull_request:
  #   types: [opened, synchronize, reopened, labeled, unlabeled]
  #   branches: [stable]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  fragment:
    name: News fragment present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Require a news fragment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail

          # Trivial changes (dependency bumps, typo fixes) opt out. The
          # platform's rule is at least one fragment per *release*, not per
          # PR, so skipping here still satisfies it.
          case ",${LABELS}," in
            *,ci/skip-changelog,*)
              echo "ci/skip-changelog is set — no fragment required."
              exit 0
              ;;
          esac

          # Dependabot applies ci/skip-changelog from .github/dependabot.yml,
          # but only at creation time, so PRs opened before that config landed
          # carry no label and this required check would block them forever.
          # Its PRs are dependency bumps by construction; exempt the author as
          # well. Compared as a string, not as a `case` pattern: `[bot]` in a
          # glob is a character class and would not match the literal login.
          # Only this one bot is exempt — humans still need a fragment, and
          # bots that open pull requests here label them at creation.
          if [ "${AUTHOR}" = "dependabot[bot]" ]; then
            echo "Opened by ${AUTHOR} — dependency update, no fragment"
            echo "required."
            exit 0
          fi

          # towncrier only assembles direct children of changelog/ whose name
          # is <id>.<type>.md, where <type> is one of the types configured in
          # pyproject.toml. "+" marks an orphan fragment (no issue number) and
          # the optional numeric segment is the counter towncrier appends when
          # a name collides. Anything else — a nested path, a missing or
          # unknown type — is ignored at release time, so it must fail here
          # rather than silently vanish from the changelog.
          #
          # `[^/]+` is deliberately permissive. towncrier scans the
          # dot-separated parts of the name from the right and takes the last
          # one that is a configured type as the category, folding everything
          # before it into the issue id. `123.unknown.fixed.md` is therefore a
          # real `fixed` fragment whose id is `123.unknown`, so narrowing this
          # would reject a file that does reach the changelog.
          TYPES="security|removed|deprecated|added|changed|fixed|housekeeping"
          FRAGMENT="^charts/[^/]+/changelog/[^/]+\.(${TYPES})(\.[0-9]+)?\.md$"

          # Ask the API which files the PR adds rather than diffing locally:
          # no dependence on checkout depth or on which commit is HEAD. The
          # REST endpoint is the paginated one: `gh pr view --json files`
          # returns only the first page, so a fragment in a large pull
          # request would go unseen and the check would fail a PR that has
          # one. Note the REST field is `.filename`, not `.path`.
          ADDED=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files?per_page=100" \
            --jq '.[] | select(.status == "added") | .filename' \
            | { grep -E "${FRAGMENT}" || true; } \
            | { grep -v '/towncrier\.md\.template$' || true; })

          if [ -z "${ADDED}" ]; then
            MSG="No news fragment found. Add one under the changelog/"
            MSG="${MSG} directory of the chart you changed, e.g."
            MSG="${MSG} charts/infrahub/changelog/, named <id>.<type>.md:"
            MSG="${MSG} uv run towncrier create --config"
            MSG="${MSG} charts/infrahub/towncrier.toml ${PR}.fixed.md — types:"
            MSG="${MSG} security, removed, deprecated, added, changed, fixed,"
            MSG="${MSG} housekeeping. A fragment in the root changelog/ is not"
            MSG="${MSG} read by any chart. Label the PR ci/skip-changelog if it"
            MSG="${MSG} genuinely needs no entry."
            echo "::error::${MSG}"
            exit 1
          fi

          echo "Found news fragment(s):"
          echo "${ADDED}"
